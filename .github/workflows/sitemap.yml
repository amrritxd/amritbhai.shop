name: Update sitemap

on:
  schedule:
    - cron: "0 */6 * * *"   # har 6 ghante
  workflow_dispatch:         # Actions tab se haath se bhi chala sakte ho

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Firebase se items lekar sitemap.xml banao
        run: |
          curl -fsS "https://amritt-editon-default-rtdb.firebaseio.com/items.json" -o items.json
          python3 - <<'PY'
          import json, re, datetime
          SITE = "https://www.amritbhai.shop"
          data = json.load(open("items.json")) or {}
          rows = ["  <url><loc>%s/</loc><changefreq>daily</changefreq><priority>1.0</priority></url>" % SITE]
          for key, v in data.items():
              if not isinstance(v, dict) or v.get("hidden"):
                  continue
              if not re.fullmatch(r"[A-Za-z0-9_-]+", key):
                  continue
              lm = ""
              if isinstance(v.get("updatedAt"), (int, float)):
                  d = datetime.datetime.fromtimestamp(v["updatedAt"] / 1000, datetime.timezone.utc)
                  lm = "<lastmod>%s</lastmod>" % d.strftime("%Y-%m-%d")
              rows.append("  <url><loc>%s/item.html?id=%s</loc>%s</url>" % (SITE, key, lm))
          xml = '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n' + "\n".join(rows) + "\n</urlset>\n"
          open("sitemap.xml", "w").write(xml)
          print(xml)
          PY
          rm -f items.json

      - name: Badlaav ho to commit karo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet || (git commit -m "Update sitemap" && git push)
