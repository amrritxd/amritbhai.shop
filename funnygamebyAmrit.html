<script>
(()=>{
"use strict";

const CONFIG={
  LASER_X:545, LASER_Y:1410, SHOW_ORIGIN:false,
  ENEMY_SIZE:240, ENEMY_SIZE_RAND:30,
  ENEMY_BAND_TOP:340, ENEMY_BAND_BOTTOM:660,
  IDLE_FPS:10, FIRE_FPS:12, MACHAR_FPS:24
};
const O={x:CONFIG.LASER_X,y:CONFIG.LASER_Y};

const URLS={
  bed:'/assets/bed_sprite.webp',
  enemy:'/assets/machar_sprite.webp',
  menu:'/assets/menu_character.webp',
  mafi:'/assets/machar_mafi.webp'
};
const AUDIO_URLS={
  main:'/assets/sounds_main.mp3',
  machar:'/assets/sounds_machar.mp3'
};

const imgs={};
const $=id=>document.getElementById(id);
const wrap=$('wrap'),cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
const loadOv=$('load'),menuOv=$('menu'),pauseOv=$('pauseOv'),mafiOv=$('mafiOv'),fill=$('fill'),pct=$('pct');
const pauseBtn=$('pauseBtn'),bubble=$('bubble');

const bgCache=document.createElement('canvas');
bgCache.width=720;bgCache.height=1280;
const bgCtx=bgCache.getContext('2d',{alpha:false});
let cachedBedFrame=-1;

const AudioCtx=window.AudioContext||window.webkitAudioContext;
let ac=AudioCtx?new AudioCtx():null;
let spriteBuf=null;
let macharBuf=null;

function ensureAudio(){
  if(!ac&&AudioCtx)ac=new AudioCtx();
  if(ac&&ac.state==='suspended')ac.resume().catch(()=>{});
}

let currentCb=null;
function loadAssets(cb){
  currentCb=cb;
  const loadOv=$('load'),fill=$('fill'),pct=$('pct'),menuOv=$('menu');
  const imgKeys=Object.keys(URLS).filter(k=>!imgs[k]);
  const total=Object.keys(URLS).length+2;
  let done=Object.keys(imgs).length+(spriteBuf?1:0)+(macharBuf?1:0);
  let finished=false;

  const prog=()=>{
    const p=Math.min(100,Math.round((done/total)*100));
    if(fill) fill.style.width=p+'%';
    if(pct) pct.textContent=p+'%';
    if(done>=total && !finished){
      finished=true;
      setTimeout(()=>{
        if(loadOv){
          loadOv.classList.add('fade-out');
          setTimeout(()=>{
            loadOv.classList.add('hidden');
            if(cb) cb();
          },350);
        } else if(cb) {
          cb();
        }
      },220);
    }
  };
  prog();

  if(imgKeys.length){
    imgKeys.forEach(k=>{
      let tries=0;
      const attempt=()=>{
        const im=new Image();
        im.decoding='async';
        const fail=()=>{
          tries++;
          setTimeout(attempt,Math.min(2500,250*tries));
        };
        im.onload=()=>{
          if(im.complete&&im.naturalWidth>0){
            imgs[k]=im;
            done++;
            prog();
          } else fail();
        };
        im.onerror=fail;
        im.src=URLS[k];
      };
      attempt();
    });
  }

  function fetchAudio(url,onSuccess){
    if(!ac){done++;prog();return;}
    let aTries=0;
    const attemptAudio=()=>{
      fetch(url)
      .then(r=>r.arrayBuffer())
      .then(b=>ac.decodeAudioData(b))
      .then(buf=>{
        onSuccess(buf);
        done++;
        prog();
      })
      .catch(()=>{
        aTries++;
        setTimeout(attemptAudio,Math.min(2500,250*aTries));
      });
    };
    attemptAudio();
  }

  if(!spriteBuf)fetchAudio(AUDIO_URLS.main,buf=>{spriteBuf=buf;});
  if(!macharBuf)fetchAudio(AUDIO_URLS.machar,buf=>{macharBuf=buf;});
}

function enterMenu(){
  const menuOv=$('menu');
  if(menuOv) menuOv.classList.remove('hidden');
  setHud(false);
  state='menu';
}
loadAssets(enterMenu);

const mp=['0% 0%','50% 0%','100% 0%','0% 100%','50% 100%','100% 100%'];let mi=0;
setInterval(()=>{if(state==='menu'){mi=(mi+1)%6;$('menuChar').style.backgroundPosition=mp[mi];}},333);

const LINES=["Tumhari Maa ka bharosaaaa!","Rishty mein ham tumhary baap ha","i'm master cuter",
"hila hila ky maar dogaaaa!","amitab mera naam hilana mera kaam!","aaaaaagg!",
"hilao tension door bhagaooo!"];
let li=0;
function say(){
  bubble.textContent=LINES[li];
  bubble.classList.remove('left','right');
  bubble.classList.add(li%2===0?'right':'left');
  li=(li+1)%LINES.length;
  bubble.style.animation='none';void bubble.offsetWidth;bubble.style.animation='';
}
say();
setInterval(()=>{if(state==='menu')say();},2400);

let macharVoiceNode=null;
let pauseElapsedAudio=0;
let pausedAtCtxTime=0;

const sfx={
  unlock(){ensureAudio();},
  suspend(){
    if(!ac)return;
    try{
      if(ac.state==='running'){
        pausedAtCtxTime=ac.currentTime;
        ac.suspend();
      }
    }catch(e){}
  },
  resume(){
    if(!ac)return;
    try{
      if(ac.state==='suspended'){
        if(pausedAtCtxTime>0){
          pauseElapsedAudio+=Math.max(0,ac.currentTime-pausedAtCtxTime);
          pausedAtCtxTime=0;
        }
        ac.resume();
      }
    }catch(e){}
  },
  playMain(start,dur){
    if(!ac||!spriteBuf||ac.state!=='running')return;
    try{
      const src=ac.createBufferSource();
      src.buffer=spriteBuf;
      src.connect(ac.destination);
      src.start(0,start,dur);
    }catch(e){}
  },
  playMachar(start,dur){
    this.stopMachar();
    if(!ac||!macharBuf||ac.state!=='running')return;
    try{
      const src=ac.createBufferSource();
      src.buffer=macharBuf;
      src.connect(ac.destination);
      src.start(0,start,dur);
      macharVoiceNode=src;
    }catch(e){}
  },
  stopMachar(){
    if(macharVoiceNode){
      try{macharVoiceNode.stop();}catch(e){}
      macharVoiceNode=null;
    }
  },
  playHit(){this.playMain(83,1.48);},
  playMiss(){this.playMain(85,1.49);}
};

function getGameClock(){
  if(!ac)return performance.now()/1000;
  const activeTime=(ac.state==='running'?ac.currentTime:(pausedAtCtxTime||ac.currentTime))-pauseElapsedAudio;
  return Math.max(0,activeTime);
}

const V_W=1080,V_H=1920;
let virtH=1920;
let state='loading', score=0;
try{score=+localStorage.getItem('hitmachar_total')||0}catch(e){}
let enemy=null,spawnAt=0,playStartClock=0,shake=0,time=0;
let lasers=[],parts=[],waves=[],pops=[];
let aiming=false,pid=null,aim={x:540,y:600};
let bedMode='idle',bedT=0,bedFireT=0;
let bw=0,bh=0,ew=0,eh=0;

function setHud(v){
  pauseBtn.classList.toggle('on',v);
  const fsBtn = $('fsBtn');
  if(fsBtn) fsBtn.classList.toggle('on',v);
}

function resize(){
  const w=wrap.clientWidth,h=wrap.clientHeight;
  if(!w||!h)return;
  const dpr=Math.min(1.5,window.devicePixelRatio||1);
  cv.width=Math.round(w*dpr);
  cv.height=Math.round(h*dpr);
  const s=cv.width/V_W;
  virtH=Math.max(V_H,cv.height/s);
  const bedYOffset=Math.max(0,virtH-V_H);
  O.y=CONFIG.LASER_Y+bedYOffset;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',resize);
resize();

function bedFrame(){
  if(bedMode==='fire'){
    const i=Math.floor(bedFireT/(1/CONFIG.FIRE_FPS));
    if(i>=4){bedMode='idle';bedT=0;}
    else return 12+i;
  }
  return Math.floor(bedT/(1/CONFIG.IDLE_FPS))%12;
}
function rayEnd(d){
  let t=1e9;
  if(d.x>1e-6)t=Math.min(t,(V_W-O.x)/d.x);else if(d.x<-1e-6)t=Math.min(t,(0-O.x)/d.x);
  if(d.y>1e-6)t=Math.min(t,(virtH-O.y)/d.y);else if(d.y<-1e-6)t=Math.min(t,(0-O.y)/d.y);
  if(!isFinite(t)||t<0)t=0;
  return{x:O.x+d.x*t,y:O.y+d.y*t};
}
function aimDir(){
  let dx=aim.x-O.x,dy=aim.y-O.y;const l=Math.hypot(dx,dy);
  if(l<10)return{x:0,y:-1};
  return{x:dx/l,y:dy/l};
}

const PASS_CFG=[
  {sndStart:0.00,dur:3.82,moveStart:0.35,moveEnd:2.00,dir:1},
  {sndStart:4.00,dur:4.67,moveStart:0.50,moveEnd:1.70,dir:-1}
];

function startEnemyPass(e,legIdx,nowClock){
  e.leg=legIdx;
  e.legStartClock=nowClock;
  const cfg=PASS_CFG[legIdx];
  e.facing=cfg.dir;
  e.x=cfg.dir===1?e.offLeftX:e.offRightX;
  sfx.playMachar(cfg.sndStart,cfg.dur);
}

function spawnEnemy(nowClock){
  const size=CONFIG.ENEMY_SIZE+Math.random()*CONFIG.ENEMY_SIZE_RAND;
  const offLeftX=-size*0.65;
  const offRightX=V_W+size*0.65;
  const bedYOffset=Math.max(0,virtH-V_H);
  const bTop=CONFIG.ENEMY_BAND_TOP+bedYOffset*0.25;
  const bBottom=CONFIG.ENEMY_BAND_BOTTOM+bedYOffset*0.35;
  const baseY=bTop+Math.random()*(bBottom-bTop);

  enemy={
    size,
    hitR:size*0.35,
    offLeftX,
    offRightX,
    x:offLeftX,
    baseY,
    y:baseY,
    facing:1,
    phase:Math.random()*6.28,freq:2.5+Math.random()*1.5,amp:18+Math.random()*16,
    phase2:Math.random()*6.28,freq2:5+Math.random()*2,amp2:6+Math.random()*8,
    leg:0,
    legStartClock:nowClock,
    animStartClock:nowClock
  };
  startEnemyPass(enemy,0,nowClock);
}

function burst(x,y){
  const cols=['#ff3b30','#d90429','#111','#222','#ff8c00','#ffd23f'];
  for(let i=0;i<24;i++){
    const a=Math.random()*6.283,sp=220+Math.random()*780;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-250,
      life:0,max:0.42+Math.random()*0.55,size:9+Math.random()*20,
      col:cols[Math.random()*cols.length|0],rect:Math.random()<0.5,
      rot:Math.random()*6.28,vr:(Math.random()*2-1)*8});
  }
  waves.push({x,y,t:0,dur:0.42});
}

function showMafiPopup() {
  state = 'mafi';
  aiming = false;
  setHud(false);
  sfx.suspend();
  try { localStorage.setItem('hitmachar_mafi', 'true'); } catch(e) {}
  mafiOv.classList.remove('hidden');
}

$('btnMaaf').onclick = () => {
  mafiOv.classList.add('hidden');
  goMenu();
};

$('btnMaroga').onclick = () => {
  mafiOv.classList.add('hidden');
  try { localStorage.setItem('hitmachar_mafi', 'false'); } catch(e) {}
  state = 'playing';
  setHud(true);
  last = performance.now();
  sfx.resume();
  spawnAt = getGameClock() + 0.45;
};

function killEnemy(){
  sfx.stopMachar();
  burst(enemy.x,enemy.y);
  score++;
  try{localStorage.setItem('hitmachar_total',score)}catch(e){}
  
  pops.push({x:enemy.x,y:enemy.y-60,t:0,txt:'+1'});
  shake=12;
  sfx.playHit();
  enemy=null;

  if (score % 15 === 0 && score > 0) {
    showMafiPopup();
  } else {
    spawnAt = getGameClock()+0.45;
  }
}

function fire(){
  if(state!=='playing')return;
  bedMode='fire';bedFireT=0;
  const d=aimDir(),end=rayEnd(d);
  let hit=null;
  if(enemy&&enemy.x>-enemy.size*0.3&&enemy.x<V_W+enemy.size*0.3){
    const cx=enemy.x-O.x,cy=enemy.y-O.y,t=cx*d.x+cy*d.y;
    if(t>0){
      const px=O.x+d.x*t,py=O.y+d.y*t;
      if(Math.hypot(enemy.x-px,enemy.y-py)<enemy.hitR)hit=enemy;
    }
  }
  lasers.push({x2:hit?enemy.x:end.x,y2:hit?enemy.y:end.y,t:0,dur:0.2,hit:!!hit});
  if(hit)killEnemy();
  else sfx.playMiss();
}

function pauseGame(){
  if(state!=='playing')return;
  aiming=false;state='paused';
  pauseOv.classList.remove('hidden');
  setHud(false);
  sfx.suspend();
}
function resumeGame(){
  if(state!=='paused')return;
  state='playing';pauseOv.classList.add('hidden');
  setHud(true);
  sfx.resume();
}
function goMenu(){
  pauseOv.classList.add('hidden');
  sfx.stopMachar();
  enemy=null;lasers=[];parts=[];waves=[];pops=[];aiming=false;
  menuOv.classList.remove('hidden');setHud(false);state='menu';
  sfx.resume();
}
function startGame(){
  if(!imgs.bed||!imgs.enemy)return;
  sfx.unlock();
  sfx.stopMachar();
  const nowClock=getGameClock();
  enemy=null;lasers=[];parts=[];waves=[];pops=[];
  spawnAt=nowClock+0.25;playStartClock=nowClock;shake=0;bedMode='idle';bedT=0;
  menuOv.classList.add('hidden');pauseOv.classList.add('hidden');
  
  let needsMafi = false;
  try { needsMafi = localStorage.getItem('hitmachar_mafi') === 'true'; } catch(e) {}
  
  if (needsMafi) {
    showMafiPopup();
  } else {
    setHud(true);
    state='playing';
  }
}
// Fullscreen Management
function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
}

function enterFullscreen() {
  const el = document.documentElement;
  try {
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req) {
      const p = req.call(el);
      if (p && p.catch) p.catch(() => {});
    }
  } catch(err) {}
}

function exitFullscreen() {
  try {
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if (exit) {
      const p = exit.call(document);
      if (p && p.catch) p.catch(() => {});
    }
  } catch(err) {}
}

function toggleFullscreen() {
  if (isFullscreen()) exitFullscreen();
  else enterFullscreen();
}

function updateFullscreenUI() {
  const fs = isFullscreen();
  const exp = $('fsIconExpand'), comp = $('fsIconCompress');
  if (exp && comp) {
    exp.classList.toggle('hidden', fs);
    comp.classList.toggle('hidden', !fs);
  }
  setTimeout(resize, 100);
}

['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
  document.addEventListener(evt, updateFullscreenUI);
});

$('fsBtn').onclick = e => {
  e.stopPropagation();
  toggleFullscreen();
};

$('play').onclick = () => {
  enterFullscreen();
  startGame();
};
pauseBtn.onclick=e=>{e.stopPropagation();pauseGame();};
$('resume').onclick=resumeGame;
$('pmenu').onclick=()=>{goMenu();};

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){pauseGame();}
  else resize();
});
window.addEventListener('blur',()=>{pauseGame();});

// PC & Touch Input Handling
let isHoveringMouse = false;

function setAim(e){
  const r=cv.getBoundingClientRect();
  if(!r.width||!r.height)return;
  aim.x=(e.clientX-r.left)/r.width*V_W;
  aim.y=(e.clientY-r.top)/r.height*virtH;
}

wrap.addEventListener('pointerenter', e => {
  if (e.pointerType === 'mouse') {
    isHoveringMouse = true;
    setAim(e);
  }
});

wrap.addEventListener('pointerleave', e => {
  if (e.pointerType === 'mouse') {
    isHoveringMouse = false;
  }
});

wrap.addEventListener('pointerdown', e => {
  sfx.unlock();
  if(state!=='playing'||e.target.closest('button'))return;
  aiming=true;pid=e.pointerId;setAim(e);
});

window.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') {
    isHoveringMouse = true;
    setAim(e);
  } else if (aiming && e.pointerId === pid) {
    setAim(e);
  }
});

window.addEventListener('pointerup', e => {
  if(aiming && (e.pointerId === pid || e.pointerType === 'mouse')) {
    aiming=false;
    fire();
  }
});

window.addEventListener('pointercancel', e => {
  if(aiming && (e.pointerId === pid || e.pointerType === 'mouse')) aiming=false;
});

wrap.addEventListener('contextmenu', e => e.preventDefault());

// Keyboard Controls for PC
window.addEventListener('keydown', e => {
  // Toggle Fullscreen: F
  if (e.code === 'KeyF') {
    e.preventDefault();
    toggleFullscreen();
    return;
  }

  // Pause / Resume: P or Escape
  if (e.code === 'KeyP' || e.code === 'Escape') {
    e.preventDefault();
    if (state === 'playing') pauseGame();
    else if (state === 'paused') resumeGame();
    return;
  }

  // Shoot or Start: Spacebar or Enter
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    sfx.unlock();
    if (state === 'menu') {
      enterFullscreen();
      startGame();
    } else if (state === 'playing') {
      fire();
    } else if (state === 'paused') {
      resumeGame();
    }
    return;
  }

  // Menu: M
  if (e.code === 'KeyM') {
    if (state === 'paused') goMenu();
  }
});

function update(dt){
  if(state!=='playing')return;
  const nowClock=getGameClock();
  time+=dt;
  if(bedMode==='idle')bedT+=dt;else bedFireT+=dt;
  shake=Math.max(0,shake-dt*45);
  lasers=lasers.filter(l=>(l.t+=dt)<l.dur);
  waves=waves.filter(w=>(w.t+=dt)<w.dur);
  pops=pops.filter(p=>{p.t+=dt;p.y-=90*dt;return p.t<0.8;});
  parts=parts.filter(p=>{
    p.life+=dt;p.vy+=1600*dt;p.vx*=0.99;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    return p.life<p.max&&p.y<V_H+80;
  });

  if(enemy){
    let cfg=PASS_CFG[enemy.leg];
    let elapsed=nowClock-enemy.legStartClock;

    while(elapsed>=cfg.dur){
      const nextLeg=(enemy.leg+1)%2;
      const nextStart=enemy.legStartClock+cfg.dur;
      startEnemyPass(enemy,nextLeg,nextStart);
      cfg=PASS_CFG[enemy.leg];
      elapsed=nowClock-enemy.legStartClock;
    }

    const startX=cfg.dir===1?enemy.offLeftX:enemy.offRightX;
    const endX=cfg.dir===1?enemy.offRightX:enemy.offLeftX;

    if(elapsed<cfg.moveStart){
      enemy.x=startX;
    }else if(elapsed<=cfg.moveEnd){
      const prog=(elapsed-cfg.moveStart)/(cfg.moveEnd-cfg.moveStart);
      enemy.x=startX+(endX-startX)*prog;
    }else{
      enemy.x=endX;
    }

    enemy.y=enemy.baseY
      +Math.sin(time*enemy.freq+enemy.phase)*enemy.amp
      +Math.sin(time*enemy.freq2+enemy.phase2)*enemy.amp2;
  }else if(nowClock>=spawnAt){
    spawnEnemy(nowClock);
  }
}

function draw(){
  if(state==='loading'||state==='menu')return;
  if(!cv.width||!cv.height)return;
  if(!imgs.bed||!imgs.enemy||!bw||!eh)return;
  const s=cv.width/V_W;
  virtH=Math.max(V_H,cv.height/s);
  const bedYOffset=Math.max(0,virtH-V_H);
  O.y=CONFIG.LASER_Y+bedYOffset;

  ctx.setTransform(s,0,0,s,0,0);
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,V_W,virtH);
  if(shake>0)ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);

  const f=bedFrame();
  if(cachedBedFrame!==f){
    cachedBedFrame=f;
    bgCtx.drawImage(imgs.bed,(f%4)*bw,((f/4)|0)*bh,bw,bh,0,0,bgCache.width,bgCache.height);
  }
  ctx.drawImage(bgCache,0,bedYOffset,V_W,V_H);

  if(CONFIG.SHOW_ORIGIN){
    ctx.strokeStyle='#ff0000';ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(O.x-60,O.y);ctx.lineTo(O.x+60,O.y);
    ctx.moveTo(O.x,O.y-60);ctx.lineTo(O.x,O.y+60);ctx.stroke();
    ctx.beginPath();ctx.arc(O.x,O.y,40,0,6.283);ctx.stroke();
  }

  if((aiming || (isHoveringMouse && state==='playing')) && state==='playing'){
    const d=aimDir(),end=rayEnd(d);
    ctx.save();
    ctx.strokeStyle='rgba(17,17,17,.85)';ctx.lineWidth=9;
    ctx.setLineDash([34,26]);ctx.lineDashOffset=-time*160;
    ctx.beginPath();ctx.moveTo(O.x,O.y);ctx.lineTo(end.x,end.y);ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(aim.x,aim.y,26,0,6.283);ctx.stroke();
    ctx.beginPath();ctx.arc(aim.x,aim.y,6,0,6.283);ctx.fillStyle='#111';ctx.fill();
    ctx.restore();
  }

  if(enemy){
    const animElapsed=Math.max(0,getGameClock()-enemy.animStartClock);
    const fr=Math.floor(animElapsed*CONFIG.MACHAR_FPS)%16;
    ctx.save();
    ctx.translate(enemy.x,enemy.y);
    ctx.scale(enemy.facing===1?-1:1,1);
    ctx.rotate(Math.sin(time*4+enemy.phase)*0.06);
    ctx.drawImage(imgs.enemy,(fr%4)*ew,((fr/4)|0)*eh,ew,eh,-enemy.size/2,-enemy.size/2,enemy.size,enemy.size);
    ctx.restore();
  }

  for(const l of lasers){
    const a=1-l.t/l.dur;
    ctx.lineCap='round';
    ctx.strokeStyle='rgba(255,59,48,'+(0.45*a)+')';ctx.lineWidth=34*a+8;
    ctx.beginPath();ctx.moveTo(O.x,O.y);ctx.lineTo(l.x2,l.y2);ctx.stroke();
    ctx.strokeStyle='rgba(255,140,0,'+(0.8*a)+')';ctx.lineWidth=18*a+4;
    ctx.beginPath();ctx.moveTo(O.x,O.y);ctx.lineTo(l.x2,l.y2);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,'+a+')';ctx.lineWidth=8*a+2;
    ctx.beginPath();ctx.moveTo(O.x,O.y);ctx.lineTo(l.x2,l.y2);ctx.stroke();
    ctx.fillStyle='rgba(255,210,63,'+(0.9*a)+')';
    ctx.beginPath();ctx.arc(O.x,O.y,42*a,0,6.283);ctx.fill();
    if(l.hit){
      ctx.strokeStyle='rgba(255,255,255,'+a+')';ctx.lineWidth=6;
      for(let i=0;i<6;i++){
        const an=i/6*6.283+l.t*10;
        ctx.beginPath();ctx.moveTo(l.x2+Math.cos(an)*20,l.y2+Math.sin(an)*20);
        ctx.lineTo(l.x2+Math.cos(an)*(60*a+20),l.y2+Math.sin(an)*(60*a+20));ctx.stroke();
      }
    }
  }

  for(const w of waves){
    const k=w.t/w.dur,r=20+k*250;
    ctx.strokeStyle='rgba(255,180,60,'+(1-k)+')';ctx.lineWidth=14*(1-k)+2;
    ctx.beginPath();ctx.arc(w.x,w.y,r,0,6.283);ctx.stroke();
  }

  for(const p of parts){
    const a=1-p.life/p.max;
    ctx.globalAlpha=a;ctx.fillStyle=p.col;
    ctx.save();
    ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    if(p.rect)ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
    else{ctx.beginPath();ctx.arc(0,0,p.size/2,0,6.283);ctx.fill();}
    ctx.restore();
  }
  ctx.globalAlpha=1;

  for(const p of pops){
    ctx.globalAlpha=1-p.t/0.8;
    ctx.font='700 70px "Comic Sans MS",sans-serif';ctx.textAlign='center';
    ctx.lineWidth=10;ctx.strokeStyle='#fff';ctx.strokeText(p.txt,p.x,p.y);
    ctx.fillStyle='#111';ctx.fillText(p.txt,p.x,p.y);
  }
  ctx.globalAlpha=1;

  ctx.textAlign='center';
  ctx.font='700 92px "Comic Sans MS",sans-serif';
  ctx.lineWidth=12;ctx.strokeStyle='rgba(255,255,255,.9)';
  ctx.strokeText(score,V_W/2,150);ctx.fillStyle='#111';ctx.fillText(score,V_W/2,150);
  ctx.font='700 34px "Comic Sans MS",sans-serif';
  ctx.lineWidth=8;ctx.strokeText('TOTAL KILLS',V_W/2,205);ctx.fillStyle='#444';ctx.fillText('TOTAL KILLS',V_W/2,205);

  const playElapsed=Math.max(0,getGameClock()-playStartClock);
  if(state==='playing'&&playElapsed<3.5){
    ctx.save();
    const a=Math.max(0,Math.min(1,(3.5-playElapsed)*1.5));
    ctx.globalAlpha=a;
    ctx.font='700 58px "Bangers","Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.lineWidth=12;
    ctx.strokeStyle='rgba(255,255,255,0.95)';
    
    const midY=virtH*0.45;
    const gap=78;
    
    // Line 1: 🎯 HOLD = AIM
    ctx.strokeText('🎯 HOLD = AIM',V_W/2,midY-gap/2);
    ctx.fillStyle='#0f172a';
    ctx.fillText('🎯 HOLD = AIM',V_W/2,midY-gap/2);
    
    // Line 2: 🔥 RELEASE = FIRE
    ctx.strokeText('🔥 RELEASE = FIRE',V_W/2,midY+gap/2);
    ctx.fillStyle='#0f172a';
    ctx.fillText('🔥 RELEASE = FIRE',V_W/2,midY+gap/2);
    
    ctx.restore();
  }

  
}

let last=performance.now();
function loop(ts){
  const dt=Math.min(0.05,(ts-last)/1000);last=ts;
  if(imgs.bed&&!bw&&imgs.bed.width){bw=imgs.bed.width/4;bh=imgs.bed.height/4;}
  if(imgs.enemy&&!ew&&imgs.enemy.width){ew=imgs.enemy.width/4;eh=imgs.enemy.height/4;}
  update(dt);draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
