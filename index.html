g.innerHTML = list.map((i, x) => `
<article class="${anim ? "card-in " : ""}group relative bg-neutral-950 border border-neutral-900 rounded-2xl p-[18px] flex flex-col gap-3.5 transition duration-300 hover:-translate-y-1 hover:border-neutral-700 hover:shadow-[0_14px_34px_-16px_rgb(var(--fg)/.28)]"${anim ? ` style="animation-delay:${Math.min(x, 10) * 40}ms"` : ""}>
<div class="flex gap-3.5 items-center">${icon(i)}
<button type="button" data-copylink="${esc(i.id)}" aria-label="Copy link" title="Copy link" class="absolute top-3 right-3 w-8 h-8 rounded-full grid place-items-center text-neutral-500 border border-transparent transition hover:text-white hover:border-neutral-800 hover:bg-neutral-900 active:scale-90"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
<div class="min-w-0 flex-1 pr-7"><div class="font-semibold truncate"><a href="/item.html?id=${encodeURIComponent(i.id)}" data-open="${esc(i.id)}" class="hover:underline">${esc(i.title)}</a></div>
<div class="flex gap-2 items-center mt-1.5 text-xs text-neutral-400 flex-wrap"><span class="px-2 py-0.5 rounded-md border border-neutral-800 text-neutral-300 text-[.68rem] font-semibold uppercase tracking-wide">${esc(i.category || "App")}</span>${isNew(i) ? `<span class="px-2 py-0.5 rounded-md bg-emerald-500/15 text-emerald-500 text-[.68rem] font-semibold">New</span>` : ""}${i.rating ? `<span>★ ${esc(i.rating)}</span>` : ""}${i.pinned ? `<span class="px-2 py-0.5 rounded-md border border-neutral-600 text-white text-[.68rem] font-semibold">★ Featured</span>` : ""}${i.badge ? `<span class="px-2 py-0.5 rounded-md bg-neutral-800 text-white text-[.68rem] font-semibold">${esc(i.badge)}</span>` : ""}${isPaid(i) ? `<span class="px-2 py-0.5 rounded-md bg-white text-black text-[.68rem] font-bold">${esc(priceTxt(i))}</span>` : ""}<span>${esc(verTxt(i.version))}${i.size ? " · " + esc(i.size) : ""}</span></div>
</div></div>
<p class="clamp2 text-neutral-400 text-[.85rem] leading-[1.55]">${esc(i.shortDesc || i.fullDesc || "")}</p>
<div class="flex gap-2.5 justify-between items-center pt-3.5 border-t border-neutral-900"><button class="${BTN}" data-open="${esc(i.id)}">Details</button>
${isPaid(i)
? `<button class="${BTNP}" data-open="${esc(i.id)}">Buy ${esc(priceTxt(i))}</button>`
: `<a class="${BTNP}" data-dl="${esc(i.id)}" href="${esc(safeUrl(i.downloadUrl))}" target="_blank" rel="noopener">${label(i)}</a>`}</div>
</article>`).join("");
}
// ===== Paid items: payment request -> owner Telegram bot (Yes/No) -> download link =====
let WORKER = "";
async function workerUrl() {
if (WORKER) return WORKER;
try {
const r = await fetch("/config.json", { cache: "no-store" });
const d = await r.json();
WORKER = String(d.worker || "").trim().replace(/\/+$/, "");
} catch (e) { WORKER = ""; }
if (!/^https:\/\//.test(WORKER)) { WORKER = ""; throw new Error("Payment system abhi set nahi hai."); }
return WORKER;
}
const isPaid = i => !!(i && i.paid && Number(i.price) > 0);
const priceTxt = i => "\u20B9" + Number(i.price);
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* ignore */ } };
async function api(path, opt) {
let r;
const base = await workerUrl();
try { r = await fetch(base + path, opt); } catch (e) { throw new Error("Server se connect nahi hua."); }
const d = await r.json().catch(() => ({}));
if (!r.ok) throw new Error(d.error || "Kuch galat hua.");
return d;
}
let poll = null, curId = null;
let clock = null, autoT = null;
const AUTO_SECS = 3; // UPI app khulne se pehle ka countdown (seconds)
const stopPoll = () => { clearInterval(poll); clearInterval(clock); clearInterval(autoT); poll = clock = autoT = null; };
const WAIT_SECS = 99; // 1 minute 39 second processing time
const mmss = n => String(Math.floor(n / 60)).padStart(2, "0") + ":" + String(n % 60).padStart(2, "0");
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const BOX = "p-4 border border-neutral-800 rounded-[14px] text-[.88rem] text-neutral-400 leading-relaxed";
function buyBox(html) { const b = $("mBuy"); b.classList.remove("hidden"); b.innerHTML = html; b.classList.remove("swap"); void b.offsetWidth; b.classList.add("swap"); $("mPay").classList.add("hidden"); }
const stepTxt = left => { const p = (WAIT_SECS - left) / WAIT_SECS; return p < 0.25 ? "Payment request mil gayi" : p < 0.7 ? "Owner payment check kar raha hai" : "Download link taiyaar ho raha hai"; };
const waitBox = left => `<div class="${BOX} text-center"><div class="mx-auto mb-3 w-11 h-11 rounded-full border-[3px] border-neutral-800 border-t-white animate-spin"></div><div class="text-white font-semibold mb-1">Payment verify ho raha hai</div><div id="mStep" class="text-xs text-neutral-400 mb-3">${stepTxt(left)}</div><div class="text-xs uppercase tracking-wider text-neutral-600 mb-1">Processing time</div><b id="mTimer" class="text-white text-2xl tabular-nums">${mmss(left)}</b>
<div class="mt-3 h-1.5 rounded-full bg-neutral-800 overflow-hidden"><div id="mBar" class="h-full bg-white transition-all duration-1000" style="width:${Math.round((WAIT_SECS - left) / WAIT_SECS * 100)}%"></div></div>
<div class="mt-3 text-xs">Page khula rakho. Approve hote hi download button yahin dikh jayega. Tab tak link hidden rahega.</div></div>`;
const lateBox = () => `<div class="${BOX}"><div class="text-white font-semibold mb-1">\u231B Abhi tak confirm nahi hua</div>Owner busy ho sakta hai. Order yaad rahega - thodi der baad ye page dobara kholo, approve hote hi link mil jayega. Paisa kat gaya ho to Telegram par batao.<a href="https://t.me/+dQcx4OpgzPM4ODA1" target="_blank" rel="noopener" class="${BTN} w-full mt-3">Telegram par contact karo</a></div>`;
async function showPay(i) {
stopPoll();
buyBox(`<div class="${BOX}">Loading...</div>`);
let cfg;
try { cfg = await api("/config"); }
catch (e) { buyBox(`<div class="${BOX}">${esc(e.message)}</div>`); $("mPay").classList.remove("hidden"); return; }
if (curId !== i.id) return;
const q = cfg.upi ? "pa=" + encodeURIComponent(cfg.upi) + "&pn=" + encodeURIComponent(cfg.name || "Amritt Editon") + "&am=" + Number(i.price) + "&cu=INR&tn=" + encodeURIComponent("Amritt Editon") : "";
const L = { any: "upi://pay?" + q, gpay: "tez://upi/pay?" + q, phonepe: "phonepe://pay?" + q, paytm: "paytmmp://pay?" + q };
const AB = BTN + " w-full";
const appBtns = `<a href="${esc(L.any)}" class="${BTNP} w-full mb-2">UPI app kholo</a>
<div class="grid grid-cols-3 gap-2 mb-3"><a href="${esc(L.gpay)}" class="${AB}">GPay</a><a href="${esc(L.phonepe)}" class="${AB}">PhonePe</a><a href="${esc(L.paytm)}" class="${AB}">Paytm</a></div>
<p class="mb-3 text-xs text-neutral-600">App na khule to UPI ID copy karke kisi bhi app se pay karo.</p>`;
const countdown = n => `<div class="mb-3 p-3 rounded-xl border border-neutral-800 text-center">UPI app <b id="mAuto" class="text-white text-lg tabular-nums">${n}</b> second mein apne aap khulega...</div>`;
const auto = isMobile && !!cfg.upi;
buyBox(`<div class="${BOX}">
<div class="text-white font-semibold text-base mb-2">${esc(priceTxt(i))} pay karo</div>
${cfg.upi
? `<div class="flex items-center gap-2 mb-3"><code class="flex-1 bg-black border border-neutral-800 rounded-lg px-3 py-2 text-white break-all">${esc(cfg.upi)}</code><button data-copy="${esc(cfg.upi)}" class="${BTN}">Copy</button></div>
<div id="mApps">${auto ? countdown(AUTO_SECS) : appBtns}</div>`
: `<div class="mb-3">UPI abhi set nahi hai.</div>`}
<input id="mNote" maxlength="100" placeholder="Apna naam / Telegram username / UTR (optional)" class="w-full px-3.5 py-3 rounded-xl bg-black border border-neutral-800 text-white text-[.9rem] outline-none focus:border-white mb-3">
<button data-sent class="${BTNP} w-full">Maine payment kar diya</button>
<p class="mt-3 text-xs text-neutral-600">Pay karne ke baad ye button dabao. Owner payment check karke approve karega, phir download link yahin dikhega.</p></div>`);
// countdown ke dauran app-buttons hidden; khatam hone par UPI app khulta hai aur buttons wapas aate hain
if (auto) {
let left = AUTO_SECS;
autoT = setInterval(() => {
const box = $("mApps");
if (curId !== i.id || !box) { clearInterval(autoT); return; }
left--;
if (left > 0) { const n = $("mAuto"); if (n) n.textContent = left; return; }
clearInterval(autoT);
box.innerHTML = appBtns;
try { location.href = L.any; } catch (e) { /* ignore */ }
}, 1000);
}
}
function showApproved(i, link, key) {
const keyHtml = key ? `<div class="mb-3"><div class="text-xs text-neutral-400 mb-1.5">Aapki Key / Login details</div>
<div class="flex items-start gap-2"><code class="flex-1 bg-black border border-neutral-800 rounded-lg px-3 py-2 text-white break-all whitespace-pre-wrap select-all">${esc(key)}</code><button data-copy="${esc(key)}" data-msg="Key copy ho gayi" class="${BTN}">Copy</button></div>
<p class="mt-2 text-xs text-neutral-600">Is key ko kisi se share mat karna.</p></div>` : "";
const linkHtml = link ? `<a data-dl="${esc(i.id)}" href="${esc(safeUrl(link))}" target="_blank" rel="noopener" class="${BTNP} w-full">${label(i)}</a>` : "";
buyBox(`<div class="${BOX}"><div class="text-white font-semibold mb-3">\u2705 Payment confirm ho gaya</div>${keyHtml}${linkHtml}</div>`);
}
function showRejected(i) {
buyBox(`<div class="${BOX}"><div class="text-white font-semibold mb-1">\u274C Failed</div>Payment verify nahi ho paya. Agar paisa kat gaya hai to owner se Telegram par baat karein.<button data-retry class="${BTN} w-full mt-3">Dobara try karo</button></div>`);
}
function startCheck(i, oid) {
stopPoll();
const t0 = Number(lsGet("ordt:" + i.id)) || Date.now();
lsSet("ordt:" + i.id, String(t0));
const left = () => Math.max(0, WAIT_SECS - Math.floor((Date.now() - t0) / 1000));
const clear = () => { lsSet("ord:" + i.id, null); lsSet("ordt:" + i.id, null); };
buyBox(left() > 0 ? waitBox(left()) : lateBox());
clock = setInterval(() => {
if (curId !== i.id) { stopPoll(); return; }
const l = left(), t = $("mTimer"), b = $("mBar");
if (l > 0) {
if (t) t.textContent = mmss(l);
const s = $("mStep"); if (s) s.textContent = stepTxt(l);
if (b) b.style.width = Math.round((WAIT_SECS - l) / WAIT_SECS * 100) + "%";
} else if (t || b) buyBox(lateBox());
}, 1000);
let n = 0;
const tick = async () => {
if (curId !== i.id) { stopPoll(); return; }
try {
const d = await api("/status?id=" + encodeURIComponent(oid));
if (curId !== i.id) return;
if (d.status === "approved" && (d.link || d.key)) { stopPoll(); showApproved(i, d.link, d.key); return; }
if (d.status === "rejected") { stopPoll(); clear(); showRejected(i); return; }
} catch (e) {
if (/not found/i.test(e.message)) { stopPoll(); clear(); showPay(i); return; }
}
if (++n > 225) stopPoll(); // ~15 min
};
tick(); poll = setInterval(tick, 4000);
}
$("mBuy").addEventListener("click", async e => {
const i = items.find(x => x.id === curId); if (!i) return;
const cp = e.target.closest("[data-copy]");
if (cp) { try { await navigator.clipboard.writeText(cp.dataset.copy); toast(cp.dataset.msg || "UPI ID copy ho gaya"); } catch (x) { /* ignore */ } return; }
if (e.target.closest("[data-retry]")) { lsSet("ord:" + i.id, null); lsSet("ordt:" + i.id, null); showPay(i); return; }
const sent = e.target.closest("[data-sent]");
if (sent) {
sent.disabled = true;
try {
const d = await api("/order", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ itemId: i.id, note: ($("mNote") || {}).value || "" }) });
lsSet("ord:" + i.id, d.orderId); lsSet("ordt:" + i.id, String(Date.now())); startCheck(i, d.orderId);
} catch (err) { sent.disabled = false; toast(err.message); }
}
});
function setModal(on) {
const m = $("modal");
if (on) { if (!m.open) m.showModal(); } else if (m.open) m.close();
document.body.style.overflow = on ? "hidden" : "";
}
function openItem(id) {
const i = items.find(x => x.id === id); if (!i) return;
$("mTop").innerHTML = icon(i) + `<div class="min-w-0 flex-1"><div class="font-semibold text-[1.15rem]">${esc(i.title)}</div><div class="flex gap-2 items-center mt-1.5 text-xs text-neutral-400 flex-wrap"><span class="px-2 py-0.5 rounded-md border border-neutral-800 text-neutral-300 text-[.68rem] font-semibold uppercase tracking-wide">${esc(i.category || "App")}</span>${i.rating ? `<span>★ ${esc(i.rating)}</span>` : ""}${i.downloads ? `<span>${esc(i.downloads)}</span>` : ""}</div></div>`;
$("mCat").textContent = i.category || "App";
$("mVer").textContent = i.version || "-";
$("mSize").textContent = i.size || "-";
$("mDesc").textContent = i.fullDesc || i.shortDesc || "";
const go = $("mGo"); go.textContent = label(i); go.dataset.dl = i.id;
if (isPaid(i)) go.removeAttribute("href"); else go.href = safeUrl(i.downloadUrl);
$("mShare").onclick = async () => {
try {
if (navigator.share) await navigator.share({ title: i.title + " - Amritt Editon", url: itemUrl(i) });
else { await navigator.clipboard.writeText(itemUrl(i)); toast("Link copy ho gaya"); }
} catch (e) { /* cancelled */ }
};
curId = i.id; stopPoll();
const paid = isPaid(i);
$("mBuy").classList.add("hidden"); $("mBuy").innerHTML = "";
$("mGo").style.display = paid ? "none" : "";
$("mPay").classList.toggle("hidden", !paid);
if (paid) {
$("mPay").textContent = "Buy " + priceTxt(i);
$("mPay").onclick = () => showPay(i);
const oid = lsGet("ord:" + i.id);
if (oid) startCheck(i, oid);
}
setModal(true);
}
function closeItem() { curId = null; stopPoll(); setModal(false); }
$("grid").addEventListener("click", async e => {
const cp = e.target.closest("[data-copylink]");
if (cp) {
const it = items.find(x => x.id === cp.dataset.copylink); if (!it) return;
try { await navigator.clipboard.writeText(itemUrl(it)); toast("Link copy ho gaya"); } catch (x) { toast("Copy nahi ho paya"); }
return;
}
});
$("grid").addEventListener("click", e => { const b = e.target.closest("[data-open]"); if (b) { e.preventDefault(); openItem(b.dataset.open); } });
$("mx").onclick = closeItem;
$("modal").addEventListener("close", () => { curId = null; stopPoll(); document.body.style.overflow = ""; });
$("modal").addEventListener("click", e => { if (e.target.id === "modal") closeItem(); });
$("tabs").addEventListener("click", e => {
const b = e.target.closest(".tab"); if (!b) return;
cat = b.dataset.c; $("ttl").textContent = titles[cat]; render(); swap();
});
const qi = $("q");
qi.addEventListener("input", () => { $("clr").hidden = !qi.value; clearTimeout(timer); timer = setTimeout(() => { q = qi.value; render(); swap(); }, 140); });
$("clr").onclick = () => { qi.value = ""; q = ""; $("clr").hidden = true; render(); qi.focus(); };
addEventListener("keydown", e => {
if (e.key === "Escape") closeItem();
if (e.key === "/" && document.activeElement !== qi) { e.preventDefault(); qi.focus(); }
});
$("yr").textContent = new Date().getFullYear();
try { const c = JSON.parse(localStorage.getItem("ae_items") || "null"); if (Array.isArray(c) && c.length) { items = c; loaded = true; } } catch (e) { /* ignore */ }
render();
try {
db = getDatabase(initializeApp(firebaseConfig));
onValue(ref(db, "items"), snap => {
const d = snap.val() || {};
items = Object.entries(d).filter(([, v]) => v && typeof v === "object" && !v.hidden)
.map(([k, v]) => ({ ...v, id: k })).map(v => { if (isPaid(v)) delete v.downloadUrl; return v; }).sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (b.createdAt || 0) - (a.createdAt || 0));
loaded = true; failed = false; render();
try { localStorage.setItem("ae_items", JSON.stringify(items)); } catch (e) { /* ignore */ }
if (!opened) { const want = new URLSearchParams(location.search).get("open"); if (want && items.some(x => x.id === want)) { opened = true; openItem(want); } }
}, () => { loaded = true; failed = true; render(); });
} catch (err) {
loaded = true; failed = true; render();
}
</script>
</body>
