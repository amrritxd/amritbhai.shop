  let best = null;

      } catch (e3) { msg.className = "text-xs mt-2 text-red-600"; msg.textContent = (hi ? "सेव नहीं हुआ: " : "Save nahi hua: ") + ((e3 && (e3.code || e3.message)) || "error"); }
      sb.disabled = false; }; }
    const cc = $("clsChips"); if (cc) cc.onclick = e => { const b = e.target.closest("[data-fc]"); if (!b) return; state.lbCls = b.dataset.fc; state.lbSub = ""; render(); };
    app.querySelectorAll("[data-cls]").forEach(b => b.onclick = () => { state.lbCls = b.dataset.cls; state.lbSub = ""; render(); window.scrollTo({ top: 0, left: 0, behavior: "instant" }); });
    const chips = $("chips"); if (chips) chips.onclick = e => { const b = e.target.closest("[data-s]"); if (!b) return; state.lbSub = b.dataset.s; render(); };
    if (tab === "students") {
      $("srch").value = state.q || ""; $("srch").oninput = e => { state.q = e.target.value; state.lbLimit = 60; clearTimeout(window._sq); window._sq = setTimeout(drawStudents, 120); };
      $("srt").onclick = () => { state.lbSort = (state.lbSort || "latest") === "latest" ? "best" : "latest"; render(); };
      window.__drawStudents = drawStudents; drawStudents();
      $("stList").onclick = e => {
        if (e.target.closest("#moreBtn")) { state.lbLimit = (state.lbLimit || 60) + 60; drawStudents(); return; }
        const row = e.target.closest("[data-nm]"); if (!row) return;
        const nx = row.nextElementSibling; if (nx && nx.classList.contains("hist")) { nx.remove(); return; }
        const h = results.filter(x => String(x.name).trim().toLowerCase() === row.dataset.nm && String(x.cls) === row.dataset.cl).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        row.insertAdjacentHTML("afterend", `<div class="hist bg-green-50/60 px-4 py-2 text-xs border-t border-green-100"><div class="font-bold text-green-700 mb-1">${esc(h[0] ? h[0].name : "")} - ${h.length} ${l.tests}</div><div class="flex flex-wrap gap-1.5 mb-1.5">` + Object.entries(h.reduce((a, x) => { const c = String(x.cls); a[c] = (a[c] || 0) + 1; return a; }, {})).map(([c, n]) => `<span class="px-2 py-0.5 rounded-full bg-white border border-green-200 text-green-700 font-semibold">${esc(clsLabel(c))}: ${baar(n)}</span>`).join("") + `</div>` + h.map(x => `<div class="flex justify-between gap-3 py-1"><span>${esc(sl(x.subject))} &middot; ${esc(clsLabel(x.cls))}${x.createdAt ? `<br><span class="font-semibold text-green-700">\u{1F552} ${fmtDT(x.createdAt)}</span>` : ""}</span><b class="shrink-0">${x.score}/${x.total} &middot; ${pc(x)}%</b></div>`).join("") + `</div>`);
      };
    }
    $("backStart").onclick = $("backTop").onclick = () => { state.screen = "start"; render(); };
  }
}

async function saveResult() {
  const p = state.pending; if (!p) return; state.saveErr = "";
  try {
    const id = state.pendingId || push(ref(db, "testResults")).key; state.pendingId = id;
    await set(ref(db, "testResults/" + id), p); state.resultId = id;
    try { tgResult(p, id); } catch (e2) {}
  } catch (e) { state.resultId = null; state.saveErr = (e && (e.code || e.message)) || "error";
    try { tgOnce("rf_" + p.createdAt, () => tgText("⚠️ <b>Result SAVE nahi hua</b>\n👤 " + tgE(p.name) + " · " + tgE(clsLabelEn(p.cls)) + " · " + tgE(p.subject) + "\n✅ " + p.score + "/" + p.total + "\nError: " + tgE(state.saveErr))); } catch (e2) {} }
}
async function submitTest() {
  if (state.submitting) return; state.submitting = true; clearInterval(window._tm);
  try { if (state.liveId) remove(ref(db, "testLive/" + state.liveId)).catch(() => {}); state.liveId = null; } catch (e) {}
  let score = 0;
  state.questions.forEach((q, i) => { const Q = q.Q; if (state.answers[i] === Number(Q.correct)) score++; });
  state.score = score;
  const timeMs = Math.max(1000, Date.now() - (state.startedAt || Date.now()));
  state.timeMs = timeMs;
  const total = state.questions.length;
  if (total > 0 && score >= total) markMastered(state.name, state.subName, state.cls);
  state.pendingId = null;
  state.pending = { name: state.name.trim().replace(/\s+/g, " "), cls: state.cls, subject: state.subName, subjectKey: state.subKey, medium: state.testLang || lang, score, total, timeMs, leaves: state.leaves || 0, createdAt: Date.now() };
  await saveResult();
  state.screen = "result";
  render();
  if (score / total >= 0.75) confetti();
  try { const cur = fullTopperOf(state.cls); if (score >= total && cur && nk(cur.name) === nk(state.name)) { podBurst(); setTimeout(() => { const h = document.querySelector("#app .th-trophy"); if (h) { const b = h.getBoundingClientRect(); firework(b.left + b.width / 2, b.top + b.height / 2, 36, ["#facc15", "#fbbf24", "#f59e0b", "#ffffff", "#4ade80"]); } }, 700); } } catch (e) {}
}

// result screen: 4 subject x 30/30 ka progress (topper banne ka raasta)
function topProgressHtml() {
  if (!state.pending) return "";

  return `<div class="mt-5 rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-left"><div class="text-xs font-bold text-amber-900 mb-2">\u{1F3AF} ${hi ? "टॉपर प्रोग्रेस" : "Topper progress"}: ${nd.length}/${SUBS.length} ${hi ? "विषय में 30/30" : "subject mein 30/30"}${nd.length === SUBS.length && cur ? " \u2014 " + (hi ? "अभी टॉपर " : "abhi topper ") + esc(cur.name) + (hi ? " है (कम समय)" : " hai (kam time)") : ""}</div><div class="flex flex-wrap gap-1.5">${chips}</div></div>`;
}
function reviewHtml() {

}
function shareResult() {

document.addEventListener("keydown", e => {
