  if (state.screen === "result") {

    const subs = {}; inCls.forEach(r => { if (r.subjectKey) subs[r.subjectKey] = r.subject || r.subjectKey; });
    if (state.lbSub && !subs[state.lbSub]) state.lbSub = "";
    const list = inCls.filter(r => !state.lbSub || r.subjectKey === state.lbSub);
    const avgP = list.length ? Math.round(list.reduce((a, r) => a + pc(r), 0) / list.length) : 0;
    const chip = (k, label) => `<button data-s="${esc(k)}" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold border transition ${state.lbSub === k ? "bg-green-600 border-green-600 text-white" : "border-green-200 text-green-700 hover:bg-green-50"}">${esc(label)}</button>`;

    } else {
      const ch = list[0];
      const champ = {};
      SUBS.forEach(x => { let bb = null; inCls.forEach(r => { if (r.subject === x && betterR(r, bb)) bb = r; }); champ[x] = bb; });
      const icon = { Maths: "\u{1F522}", Science: "\u{1F52C}", English: "\u{1F4D6}", Hindi: "\u0905" };

      const rankBadge = i => i < 3 ? `<div class="w-10 h-10 grid place-items-center text-2xl shrink-0">${medal(i)}</div>` : `<div class="w-10 h-10 rounded-full bg-green-100 text-green-700 grid place-items-center font-extrabold text-sm shrink-0">${i + 1}</div>`;

        <div class="rounded-3xl border border-green-100 overflow-hidden bg-white/90 shadow-lg shadow-green-100/60">

            <div class="min-w-[58px] px-2 py-1.5 rounded-xl bg-green-600 text-white text-center text-xs font-extrabold shrink-0">${esc(clsLabel(o.c))}</div>

            <div class="text-right shrink-0"><div class="font-extrabold text-green-700">${o.r.score}<span class="text-xs text-neutral-400 font-semibold">/${o.r.total}</span></div>${o.r.timeMs ? `<div class="text-[.65rem] text-neutral-500">${fmtT(o.r.timeMs)}</div>` : ""}</div>
            <span class="text-green-600">\u203A</span>
          </button>`).join("")}
        </div>` : "";
      body = `${filters}` + (!ch ? `<p class="text-center text-neutral-500 py-12 border border-dashed border-green-200 rounded-2xl">${l.none}</p>` : `
        <div class="pop rounded-3xl p-5 text-white bg-gradient-to-br from-green-700 via-green-600 to-emerald-400 shadow-xl shadow-green-200">
          <div class="text-xs font-bold tracking-wider opacity-90">\u{1F947} ${l.no1}${state.lbSub ? " \u00B7 " + esc(sl(subs[state.lbSub])) : ""}</div>
          <div class="text-2xl font-extrabold mt-2 break-words">${esc(ch.name)}</div>
          <div class="text-sm opacity-90">${esc(clsLabel(ch.cls))} \u00B7 ${esc(sl(ch.subject))}</div>
          <div class="flex flex-wrap gap-2 mt-4">
            <span class="px-4 py-1.5 rounded-full bg-white text-green-800 font-extrabold text-sm">${ch.score}/${ch.total} ${l.correct}</span>
            ${ch.timeMs ? `<span class="px-4 py-1.5 rounded-full bg-white/20 font-bold text-sm">\u23F1 ${fmtT(ch.timeMs)}</span>` : ""}

        <h3 class="text-sm font-bold text-green-700 mt-7 mb-3">${state.lbCls ? esc(clsLabel(state.lbCls)) + " \u00B7 " : ""}${state.lbCls ? l.top10 : l.overall}</h3>
        <div class="rounded-3xl border border-green-100 overflow-hidden bg-white/90 shadow-lg shadow-green-100/60 stagger">
          ${top10.map((r, i) => `<div class="flex items-center gap-3 px-4 py-3 ${i ? "border-t border-green-50" : ""} ${isMe(r) ? "bg-green-50 ring-2 ring-inset ring-green-500" : ""}">
            ${rankBadge(i)}
            <div class="flex-1 min-w-0"><div class="font-semibold text-sm truncate">${esc(r.name)}${isMe(r) ? ` <span class="text-[.6rem] px-1.5 py-0.5 rounded-full bg-green-600 text-white font-semibold align-middle">${l.you}</span>` : ""}</div><div class="text-[.7rem] text-neutral-500 truncate">${esc(clsLabel(r.cls))} \u00B7 ${esc(sl(r.subject))}</div></div>
            <div class="text-right shrink-0"><div class="font-extrabold text-green-700">${r.score}<span class="text-xs text-neutral-400 font-semibold">/${r.total}</span></div>${r.timeMs ? `<div class="text-[.65rem] text-neutral-500">${fmtT(r.timeMs)}</div>` : ""}</div>
          </div>`).join("")}
        </div>
        <h3 class="text-sm font-bold text-green-700 mt-7 mb-3">${l.subTop}</h3>
        <div class="rounded-3xl border border-green-100 overflow-hidden bg-white/90 shadow-lg shadow-green-100/60">
          ${SUBS.map((x, i) => { const r = champ[x]; return `<div class="flex items-center gap-3 px-4 py-3 ${i ? "border-t border-green-50" : ""}">
            <div class="w-10 h-10 rounded-xl bg-green-100 grid place-items-center text-lg font-bold text-green-700 shrink-0">${icon[x]}</div>
            <div class="flex-1 min-w-0"><div class="text-[.7rem] font-bold text-green-700">${sl(x)}</div>${r ? `<div class="font-semibold text-sm truncate">${esc(r.name)} <span class="text-neutral-400 font-normal">\u00B7 ${esc(clsLabel(r.cls))}</span></div>` : `<div class="text-sm text-neutral-400">${l.noTop}</div>`}</div>

          </div>`; }).join("")}
        </div>`);
    }
    app.innerHTML = head + body + `<button id="backStart" class="block w-full text-center text-sm text-green-700 hover:text-green-900 mt-7">&larr; ${l.back}</button>`;

    const drawStudents = () => {
      const box = $("stList"); if (!box) return;
      const q = (($("srch") || {}).value || "").trim().toLowerCase();
      const rankOf = new Map(list.map((r, i) => [r.id, i + 1]));
      const liveHtml = "";
      let rows = list.filter(r => !q || String(r.name).toLowerCase().includes(q));
      if ((state.lbSort || "latest") === "latest") rows = rows.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      if (!rows.length) { box.innerHTML = liveHtml + `<p class="text-center text-neutral-500 py-12 border border-dashed border-green-200 rounded-2xl">${l.none}</p>`; return; }
      box.innerHTML = liveHtml + `<div class="rounded-3xl border border-green-100 overflow-hidden bg-white/90 shadow-lg shadow-green-100/60 stagger">` + rows.map((r, i) => {
        const p = pc(r), rk = rankOf.get(r.id), dt = r.createdAt ? new Date(r.createdAt).toLocaleDateString(lang === "hi" ? "hi-IN" : "en-IN", { day: "numeric", month: "short" }) : "";
        const col = p >= 75 ? "text-green-700" : p >= 50 ? "text-amber-600" : "text-red-500";
        return `<div data-nm="${esc(String(r.name).trim().toLowerCase())}" class="cursor-pointer flex items-center gap-3 px-4 py-3 ${i ? "border-t border-green-50" : ""} ${isMe(r) ? "bg-green-50 ring-2 ring-inset ring-green-500" : ""}">
          <div class="w-10 h-10 rounded-full ${rk <= 3 ? "bg-green-600 text-white" : "bg-green-100 text-green-700"} grid place-items-center font-bold shrink-0">${esc(ini(r.name))}</div>

            <div class="flex items-center gap-1.5"><span class="font-semibold text-sm truncate">${esc(r.name)}</span>${isMe(r) ? `<span class="text-[.6rem] px-1.5 py-0.5 rounded-full bg-green-600 text-white font-semibold">${l.you}</span>` : ""}${rk <= 3 ? `<span>${medal(rk - 1)}</span>` : ""}</div>
            <div class="text-[.68rem] text-neutral-500 truncate">${esc(clsLabel(r.cls))} &middot; ${esc(sl(r.subject))}${dt ? " &middot; " + dt : ""}</div>
            <div class="h-1.5 rounded-full bg-green-100 mt-1.5 overflow-hidden"><div class="bar h-full rounded-full bg-gradient-to-r from-green-600 to-green-400" style="width:${p}%"></div></div>
          </div>
          <div class="text-right shrink-0"><div class="font-extrabold text-base ${col}">${r.score}<span class="text-xs text-neutral-400 font-semibold">/${r.total}</span></div><div class="text-[.68rem] font-semibold ${col}">${p}%</div>${r.timeMs ? `<div class="text-[.65rem] text-neutral-500">${fmtT(r.timeMs)}</div>` : ""}</div>
        </div>`; }).join("") + `</div>`;
      const me = box.querySelector(".ring-inset"); if (me && !state.metSeen) { state.metSeen = 1; me.scrollIntoView({ block: "center" }); }
    };
    $("tabs").onclick = e => { const b = e.target.closest("[data-tab]"); if (b) { state.lbTab = b.dataset.tab; render(); } };
    const fc = $("fc"); if (fc) fc.onchange = e => { state.lbCls = e.target.value; state.lbSub = ""; render(); };
    app.querySelectorAll("[data-cls]").forEach(b => b.onclick = () => { state.lbCls = b.dataset.cls; state.lbSub = ""; render(); window.scrollTo(0, 0); });
    const chips = $("chips"); if (chips) chips.onclick = e => { const b = e.target.closest("[data-s]"); if (!b) return; state.lbSub = b.dataset.s; render(); };
    if (tab === "students") {
      $("srch").value = state.q || ""; $("srch").oninput = e => { state.q = e.target.value; drawStudents(); };
      $("srt").onclick = () => { state.lbSort = (state.lbSort || "latest") === "latest" ? "best" : "latest"; render(); };
      window.__drawStudents = drawStudents; drawStudents();
      $("stList").onclick = e => {
        const row = e.target.closest("[data-nm]"); if (!row) return;
        const nx = row.nextElementSibling; if (nx && nx.classList.contains("hist")) { nx.remove(); return; }
        const h = results.filter(x => String(x.name).trim().toLowerCase() === row.dataset.nm).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        row.insertAdjacentHTML("afterend", `<div class="hist bg-green-50/60 px-4 py-2 text-xs border-t border-green-100"><div class="font-bold text-green-700 mb-1">${esc(h[0] ? h[0].name : "")} - ${h.length} ${l.tests}</div>` + h.map(x => `<div class="flex justify-between py-1"><span>${esc(sl(x.subject))} &middot; ${esc(clsLabel(x.cls))} &middot; ${x.createdAt ? new Date(x.createdAt).toLocaleDateString(lang === "hi" ? "hi-IN" : "en-IN", { day: "numeric", month: "short" }) : ""}</span><b>${x.score}/${x.total} &middot; ${pc(x)}%</b></div>`).join("") + `</div>`);
      };
    }
    $("backStart").onclick = () => { state.screen = "start"; render(); };
  }
}

async function saveResult() {
  const p = state.pending; if (!p) return; state.saveErr = "";
  try {
    const id = state.pendingId || push(ref(db, "testResults")).key; state.pendingId = id;
    await set(ref(db, "testResults/" + id), p); state.resultId = id;
  } catch (e) { state.resultId = null; state.saveErr = (e && (e.code || e.message)) || "error"; }
}
async function submitTest() {
  if (state.submitting) return; state.submitting = true; clearInterval(window._tm);
  try { if (state.liveId) remove(ref(db, "testLive/" + state.liveId)).catch(() => {}); state.liveId = null; } catch (e) {}
  let score = 0;
  state.questions.forEach((q, i) => { const Q = q.Q; if (state.answers[i] === Number(Q.correct)) score++; });
  state.score = score;
  const timeMs = Math.max(1000, Date.now() - (state.startedAt || Date.now()));
  state.timeMs = timeMs;
  const total = state.questions.length;
  state.pendingId = null;
  state.pending = { name: state.name.trim().replace(/\s+/g, " "), cls: state.cls, subject: state.subName, subjectKey: state.subKey, medium: state.testLang || lang, score, total, timeMs, leaves: state.leaves || 0, createdAt: Date.now() };
  await saveResult();
  state.screen = "result";
  render();
  if (score / total >= 0.75) confetti();
}
function reviewHtml() {
  return `<div class="text-left mt-6 space-y-3">` + state.questions.map((q, i) => { const Q = q.Q, a = state.answers[i], c = Number(Q.correct), ok = a === c;
    return `<div class="rounded-2xl border ${ok ? "border-green-200 bg-green-50/60" : "border-red-200 bg-red-50/60"} p-3.5 text-sm"><div class="font-semibold">${i + 1}. ${esc(Q.q)}</div><div class="mt-1 ${ok ? "text-green-700" : "text-red-600"}">${ok ? "\u2714" : "\u2718"} ${esc(Q.options[a] ?? "-")}</div>${ok ? "" : `<div class="text-green-700">\u2714 ${esc(Q.options[c] ?? "")}</div>`}</div>`; }).join("") + `</div>`;
}
function shareResult() {
  const txt = T[lang].shareTxt(sl(state.subName), state.score, state.questions.length);
  if (navigator.share) navigator.share({ text: txt }).catch(() => {}); else window.open("https://wa.me/?text=" + encodeURIComponent(txt), "_blank");
}
document.addEventListener("keydown", e => {
  if (state.screen !== "quiz" || e.ctrlKey || e.metaKey || e.altKey) return;
  const i = state.qi, q = state.questions[i], Q = q.Q;
  if (/^[1-9]$/.test(e.key) && +e.key <= Q.options.length) { const ob = document.querySelector(`#opts [data-i="${+e.key - 1}"]`); if (ob) ob.click(); }
  else if (e.key === "ArrowRight" && state.answers[i] != null && $("nextBtn")) $("nextBtn").click();
});
window.addEventListener("beforeunload", e => { if (state.screen === "quiz") { e.preventDefault(); e.returnValue = ""; } });

render();
</script>
</body>
</html>
