<style>
html{background:#fff}
body{background:radial-gradient(900px 380px at 50% -80px,rgba(22,163,74,.13),transparent 70%),#fff}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.pop{animation:pop .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes fall{0%{transform:translate3d(0,-20px,0) rotate(0);opacity:1}100%{transform:translate3d(var(--dx),105vh,0) rotate(var(--rot));opacity:0}}
.confetti{position:fixed;top:0;z-index:300;pointer-events:none;animation:fall var(--t) ease-in forwards}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.grow{transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes bar{from{width:0}}
.bar{animation:bar .9s ease-out both}
.opt,.sub{transition:transform .15s,border-color .15s,background-color .15s}
.opt:active,.sub:active{transform:scale(.98)}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.floaty{display:inline-block;animation:floaty 2s ease-in-out infinite}
@keyframes shine{0%,100%{box-shadow:0 0 0 0 rgba(253,224,71,.6)}50%{box-shadow:0 0 28px 8px rgba(253,224,71,.5)}}
.shine{animation:shine 2.2s ease-in-out infinite}
::-webkit-scrollbar{display:none}
button:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid #16a34a;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}
</style>
</head>
<body class="text-neutral-900 font-sans min-h-screen antialiased">

<header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-green-100">
  <div class="max-w-[640px] mx-auto px-5 py-3.5 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2.5 font-bold tracking-tight text-[.95rem]">
      <span class="w-8 h-8 rounded-[9px] bg-green-600 text-white grid place-items-center font-extrabold">A</span>Amritt Edition
    </a>
    <button id="langBtn" aria-label="Change language" class="px-3.5 py-1.5 rounded-full border border-green-200 text-green-700 text-xs font-semibold hover:bg-green-50 transition">EN / हिं</button>
  </div>
</header>

<main class="max-w-[640px] mx-auto px-5 py-8" id="app"><p class="text-center text-neutral-500 py-16">Loading...</p><noscript><p class="text-center py-10">Test dene ke liye JavaScript on karein.</p></noscript></main>

<footer class="border-t border-green-100 text-center text-neutral-500 text-[.78rem] px-5 pt-6 pb-10">&copy; <span id="yr"></span> Amritt Edition. Created by Amrit Tiwari.</footer>

<script type="module">
let initializeApp, getDatabase, ref, onValue, get, push, set, runTransaction, remove, onDisconnect, query, orderByKey, limitToLast;
try {
  ({ initializeApp } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js"));
  ({ getDatabase, ref, onValue, get, push, set, runTransaction, remove, onDisconnect, query, orderByKey, limitToLast } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js"));
} catch (e) {
  document.getElementById("app").innerHTML = '<div class="text-center py-16"><p class="text-red-600 font-semibold">Server load nahi hua. Internet check karein.</p><button onclick="location.reload()" class="mt-4 px-6 py-2.5 rounded-full bg-green-600 text-white font-semibold">Retry</button></div>';
  throw e;
}

const _k = "AmritEdition", _d = s => { const b = atob(s); let o = ""; for (let i = 0; i < b.length; i++) o += String.fromCharCode(b.charCodeAt(i) ^ _k.charCodeAt(i % _k.length)); return o; };
const firebaseConfig = JSON.parse(_d("Ok8TGR0OARBWU00vCBcTOg0GBwc/PCcHOyAdEAYDEz1CLx8eFSkTO0czXS9FJB9edl1QRVYkER0cLQADIAQcS05nBQQGABsabAgWAAAqCkcSAB0LIwwBDBU1FEcXBgJMbU8WCAAkBggHDDo8DU9ISxwxEBkHU0BBIAAAAAAxSQwQABsBL0AWDBIkEQUARB0aJQ9cDx03AQsVGgoHLkMRBhlnSEsEGwAEJA4GIBBnXksVBB0HNRlfDBAsEAYaS0NMMhkdGxUiASsBCgQLNU9ISxUoFgAAHUILJQQGBhprAgAGDA0PMggBHRs3BQ4RRw4eMU9eSxkgFxoVDgYAJj4XBxAgFiAQS1VMdlhGX0N1UlxCWFpeY0FQCAQ1LQ1WU01fe1pHXUJyVF9BX15bcVcFDBZ/AQhFWw0KJQhBWRZ2UVxCXgwNIl0QXlY4"));
const db = getDatabase(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
$("yr").textContent = new Date().getFullYear();

const QCOUNT = 30;
const CLASSES = ["LKG", "UKG", ...Array.from({ length: 12 }, (_, i) => String(i + 1))];
const clsLabel = c => /^\d+$/.test(c) ? "Class " + c : c;

const T = {
  en: { title: "Amrit Tiwari Test", sub: "Choose your class and subject", namePh: "Your full name", cls: "Select your class", pickSub: "Choose a subject", pickClass: "Select your class first.", noSub: "No test is available for this class yet.", need: "Please enter your name and class.", q: "Question", of: "of", next: "Next", submit: "Submit Test", result: "Your Result", rank: "Rank in this subject", viewLb: "View Leaderboard", retake: "Take Another Test", lb: "Leaderboard", lbSub: "Top scorers", all: "All subjects", noResults: "No one has taken this test yet. Be the first!", players: "Players", best: "Top score", avg: "Average", you: "You", loading: "Loading...", back: "Back to tests", qs: "questions",
    praise: p => p >= 90 ? "Outstanding performance!" : p >= 75 ? "Great job!" : p >= 50 ? "Good effort, keep going!" : "Keep practicing, you'll improve!" },
  hi: { title: "Amrit Tiwari Test", sub: "Apni class aur subject chunein", namePh: "Apna poora naam", cls: "Apni class chunein", pickSub: "Subject chunein", pickClass: "Pehle apni class chunein.", noSub: "Is class ke liye abhi koi test nahi hai.", need: "Kripya naam aur class bharein.", q: "Prashn", of: "mein se", next: "Agla", submit: "Test Jama Karein", result: "Aapka Result", rank: "Is subject mein rank", viewLb: "Leaderboard Dekhein", retake: "Dusra Test Dein", lb: "Leaderboard", lbSub: "Top scorers", all: "Sabhi subjects", noResults: "Abhi tak kisi ne ye test nahi diya. Sabse pehle aap dein!", players: "Players", best: "Top score", avg: "Average", you: "Aap", loading: "Load ho raha hai...", back: "Tests par wapas", qs: "sawaal",
    praise: p => p >= 90 ? "Shandar pradarshan!" : p >= 75 ? "Bahut badhiya!" : p >= 50 ? "Achha prayas, aage badhte rahein!" : "Practice karte rahein, sudhaar hoga!" }
};

const LB = {
  en: { stu: "Students", top: "Toppers", all: "All", allCls: "All classes (sabhi)", search: "Search name...", latest: "Latest", best: "Best score", tests: "Tests", avg: "Average", champ: "CHAMPION", none: "No students yet. Be the first to take the test!", podium: "Top 3 Podium", subChamp: "Subject Champions", you: "You", back: "Back", stuTitle: "All Students who took the test", liveNow: "Taking the test now", taking: "In progress..." },
  hi: { stu: "Students", top: "Toppers", all: "Sab", allCls: "Sabhi class", search: "Naam khojein...", latest: "Naya", best: "Best score", tests: "Tests", avg: "Average", champ: "CHAMPION", none: "Abhi koi student nahi hai. Pehle aap test dein!", podium: "Top 3 Podium", subChamp: "Subject Champions", you: "Aap", back: "Wapas", stuTitle: "Test dene wale sabhi Students", liveNow: "Abhi test de rahe hain", taking: "Test chal raha..." }
};
let lang = "en"; try { lang = localStorage.getItem("amrit_test_lang") === "hi" ? "hi" : "en"; } catch (e) {}
$("langBtn").addEventListener("click", () => { lang = lang === "en" ? "hi" : "en"; try { localStorage.setItem("amrit_test_lang", lang); } catch (e) {} render(); });

// name + class saved on this device
let saved = {};
try { saved = JSON.parse(localStorage.getItem("amrit_test_profile") || "{}"); } catch (e) {}
const saveProfile = () => { try { localStorage.setItem("amrit_test_profile", JSON.stringify({ name: state.name, cls: state.cls, ok: state.saved, sid: saved.sid, createdAt: saved.createdAt })); } catch (e) {} };

let dbErr = "", results = [], loadedR = false, bank = {}, bankLoading = false;
let state = { saved: !!(saved.ok && saved.name && saved.cls), screen: "start", name: saved.name || "", cls: saved.cls || "", subKey: "", subName: "", questions: [], answers: [], qi: 0, score: 0, lbCls: "", lbSub: "" };

onValue(query(ref(db, "testResults"), orderByKey(), limitToLast(1000)), snap => {
  const rows = [];
  snap.forEach(c => { const v = c.val(); if (v && typeof v === "object" && Number(v.total) > 0) rows.push({ id: c.key, ...v, score: Number(v.score) || 0, total: Number(v.total), name: String(v.name || "").trim() || "Student", cls: String(v.cls || "") }); });
  rows.sort((a, b) => (b.score / b.total - a.score / a.total) || ((a.timeMs || 1e12) - (b.timeMs || 1e12)) || ((a.createdAt || 0) - (b.createdAt || 0)));
  results = rows; loadedR = true;
  updateSEO();
  if (state.screen === "leaderboard" || state.screen === "result") render();
}, err => { loadedR = true; dbErr = (err && (err.code || err.message)) || "error"; if (state.screen === "leaderboard") render(); });

let live = [];

const SUBS = ["Maths", "Science", "English", "Hindi"];
let toppers = {};
const betterR = (a, b) => !b || (a.score / a.total > b.score / b.total) || (a.score / a.total === b.score / b.total && (a.timeMs || 1e12) < (b.timeMs || 1e12));
onValue(ref(db, "testToppers"), snap => { toppers = snap.val() || {}; updateSEO(); if (state.screen === "start") renderFaq(); }, () => {});
function topTxt(r) { return r ? `${r.name} (${clsLabel(r.cls)}) - ${r.score}/${r.total}${r.timeMs ? " in " + fmtT(r.timeMs) : ""}` : "Abhi koi topper nahi - pehle aap test dein!"; }
function renderFaq() {
  const b = $("faq"); if (!b) return; 
  b.innerHTML = `<h2 class="text-sm font-bold text-green-700 mb-3">FAQ - All-time Topper</h2>` + SUBS.map(x => `<details class="border border-green-100 rounded-xl px-4 py-3 mb-2 bg-white"><summary class="text-sm font-semibold cursor-pointer">Amrit Tiwari Test App me ${x} ka topper kaun hai?</summary><p class="text-sm text-neutral-600 mt-2">${esc(x)} ka all-time topper: <b>${esc(topTxt(toppers[x]))}</b>. Zyada sahi jawab aur kam time wala topper banta hai.</p></details>`).join("");
}
function updateSEO() {
  let top = null; Object.values(toppers).forEach(r => { if (r && betterR(r, top)) top = r; });
  top = top || results[0];
  if (!top) return;
  const title = `Amrit Tiwari Test - Topper: ${top.name} (${clsLabel(top.cls)}) | Leaderboard`;
  const desc = `${top.name} is topping the Amrit Tiwari Test leaderboard with ${top.score}/${top.total}${top.timeMs ? " in " + fmtT(top.timeMs) : ""} in ${top.subject || "the test"} (${clsLabel(top.cls)}). See the full leaderboard on Amritt Edition.`;
  document.title = $("pageTitle").textContent = title;
  $("metaDesc").setAttribute("content", desc); $("ogTitle").setAttribute("content", title); $("ogDesc").setAttribute("content", desc);
}

function confetti() {
  for (let n = 0; n < 26; n++) {
    const el = document.createElement("span"); el.className = "confetti";
    const s = 8 + (n % 3) * 4;
    el.innerHTML = `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${["#16a34a", "#4ade80", "#bbf7d0"][n % 3]}"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg>`;
    el.style.left = Math.random() * 100 + "vw";
    el.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
    el.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
    el.style.setProperty("--t", (1.4 + Math.random() * 1.2) + "s");
    document.body.appendChild(el); setTimeout(() => el.remove(), 2800);
  }
}
const fmtT = ms => { if (!ms) return ""; const s = Math.round(ms / 1000), m = Math.floor(s / 60); return m + "m " + String(s % 60).padStart(2, "0") + "s"; };
const medal = i => i === 0 ? "\u{1F3C6}" : i === 1 ? "\u{1F948}" : i === 2 ? "\u{1F949}" : "";
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clsOptions = sel => CLASSES.map(c => `<option value="${c}" ${sel === c ? "selected" : ""}>${clsLabel(c)}</option>`).join("");
const inputCls = "w-full px-4 py-3.5 rounded-xl bg-white border border-green-200 text-neutral-900 outline-none focus:border-green-600 focus:ring-2 focus:ring-green-100";
const btnMain = "bg-green-600 text-white font-semibold hover:bg-green-700 active:scale-95 transition";
const btnLine = "border border-green-200 text-green-700 font-semibold hover:bg-green-50 active:scale-95 transition";

function markDirty() { state.saved = false; saveProfile(); const b = $("saveBtn"); if (b) { b.disabled = false; b.textContent = lang === "hi" ? "Save karein" : "Save"; } loadSubjects(); }
async function saveStudent() {
  const t = T[lang], n = state.name.trim().replace(/\s+/g, " ");
  if (n.length < 2 || !state.cls) { $("err").textContent = t.need; $("err").classList.remove("hidden"); (n.length < 2 ? $("nm") : $("cl")).focus(); return; }
  $("err").classList.add("hidden"); state.name = n; state.saved = true;
  saved.createdAt = saved.createdAt || Date.now();
  try { saved.sid = saved.sid || push(ref(db, "testStudents")).key; } catch (e) {}
  saveProfile();
  try { await set(ref(db, "testStudents/" + saved.sid), { name: n, cls: state.cls, createdAt: saved.createdAt, updatedAt: Date.now() }); } catch (e) {}
  render();
}
async function loadSubjects() {
  const box = $("subs"); if (!box) return;
  const t = T[lang];
  if (!state.saved) { box.innerHTML = `<p class="text-xs text-neutral-500 text-center py-2">${lang === "hi" ? "Subject dekhne ke liye pehle naam aur class Save karein." : "Save your name and class to see subjects."}</p>`; return; }
  if (!state.cls) { box.innerHTML = `<p class="text-sm text-neutral-500 text-center py-4">${t.pickClass}</p>`; return; }
  box.innerHTML = `<p class="text-sm text-neutral-500 text-center py-4">${t.loading}</p>`;
  const cls = state.cls; bankLoading = true;
  try { const s = await get(ref(db, "testBank/" + cls)); bank = s.val() || {}; } catch (e) { bank = {}; }
  bankLoading = false;
  if (cls !== state.cls || !$("subs")) return;
  const ALLOWED = ["Maths", "Science", "English", "Hindi"];
  const subOf = k => (bank[k] && bank[k].name) || k;
  const keys = Object.keys(bank).filter(k => ALLOWED.includes(subOf(k)) && bank[k] && bank[k].items && Object.values(bank[k].items).filter(Boolean).length)
    .sort((x, y) => ALLOWED.indexOf(subOf(x)) - ALLOWED.indexOf(subOf(y)));
  if (!keys.length) { $("subs").innerHTML = `<p class="text-sm text-neutral-500 text-center py-4">${t.noSub}</p>`; return; }
  $("subs").innerHTML = `<p class="text-xs font-semibold text-green-700 mb-2.5">${t.pickSub}</p><div class="grid grid-cols-2 gap-2.5">` + keys.map(k => {
    const n = Object.values(bank[k].items).filter(Boolean).length;
    return `<button data-k="${esc(k)}" class="sub text-left px-4 py-3.5 rounded-xl border border-green-200 bg-green-50/60 hover:border-green-600"><div class="font-semibold text-sm truncate">${esc(bank[k].name || k)}</div><div class="text-[.7rem] text-neutral-500 mt-0.5">${Math.min(QCOUNT, n)} ${t.qs}</div></button>`;
  }).join("") + `</div>`;
  $("subs").onclick = e => { const b = e.target.closest("[data-k]"); if (b) startTest(b.dataset.k); };
}

function startTest(k) {
  const t = T[lang];
  if (state.name.trim().length < 2 || !state.cls) { $("err").textContent = t.need; $("err").classList.remove("hidden"); (state.name.trim().length < 2 ? $("nm") : $("cl")).focus(); return; }
  const items = Object.values(bank[k].items).filter(x => x && (x.en || x.hi) && ((x.en || x.hi).options || []).length > 1);
  const qs = shuffle(items).slice(0, QCOUNT);
  clearInterval(window._tm); window._tm = setInterval(() => { const e = $("tm"); if (e && state.startedAt) e.textContent = fmtT(Date.now() - state.startedAt); }, 1000);
  state = { ...state, screen: "quiz", submitting: false, resultId: null, saveErr: "", review: false, pending: null, startedAt: Date.now(), subKey: k, subName: bank[k].name || k, questions: qs, answers: new Array(qs.length).fill(null), qi: 0, score: 0 };
    render();
}

let _rk = "", _sk = "";
function render() {
  const a = document.activeElement, ai = a && a.id, ss = a && a.selectionStart;
  const key = [state.screen, state.qi, lang, state.lbTab, state.lbCls, state.lbSub, state.review].join("|"), fresh = key !== _rk; _rk = key;
  renderInner();
  if (!fresh) $("app").querySelectorAll(".pop,.grow,.bar").forEach(el => el.style.animation = "none");
  const sk = state.screen + "|" + state.qi; if (sk !== _sk) { _sk = sk; window.scrollTo(0, 0); }
  if (ai === "srch" && $("srch")) { $("srch").focus(); try { $("srch").setSelectionRange(ss, ss); } catch (e) {} }
}
function renderInner() {
  const t = T[lang], app = $("app");

  if (state.screen === "start") {
    app.innerHTML = `
      <div class="pop text-center pt-6 pb-2">
        <h1 class="text-3xl font-extrabold tracking-tight text-green-700">${t.title}</h1>
        <p class="text-neutral-500 mt-2 text-sm">${t.sub} &middot; ${QCOUNT} ${t.qs}</p>
      </div>
      <div class="pop mt-8 p-5 rounded-2xl border border-green-100 bg-green-50/40">
        <input id="nm" aria-label="${t.namePh}" value="${esc(state.name)}" maxlength="60" placeholder="${t.namePh}" autocomplete="off" class="${inputCls} mb-3">
        <select id="cl" aria-label="${t.cls}" class="${inputCls}"><option value="">${t.cls}</option>${clsOptions(state.cls)}</select>
        <p id="err" class="hidden text-red-500 text-xs mt-2"></p>
        <button id="saveBtn" class="mt-3 w-full py-3 rounded-xl ${btnMain} disabled:opacity-60">${state.saved ? "\u2714 Saved" : (lang === "hi" ? "Save karein" : "Save")}</button>
        <div id="subs" class="mt-5"></div>
      </div>
      <div class="grid grid-cols-2 gap-2.5 mt-5"><button data-go="students" class="goTab py-3 rounded-2xl ${btnLine}">\u{1F465} ${LB[lang].stu}</button><button data-go="toppers" class="goTab py-3 rounded-2xl ${btnMain}">\u{1F3C6} ${LB[lang].top}</button></div>
      <div id="faq" class="sr-only" aria-hidden="false"></div>`;
    renderFaq();
    $("nm").oninput = e => { state.name = e.target.value; markDirty(); };
    $("saveBtn").disabled = state.saved; $("saveBtn").onclick = saveStudent;
    $("cl").onchange = e => { state.cls = e.target.value; markDirty(); };
    document.querySelectorAll(".goTab").forEach(b => b.onclick = () => { state.lbTab = b.dataset.go; state.lbSort = state.lbSort || "latest"; state.screen = "leaderboard"; render(); });
    loadSubjects();
    return;
  }

  if (state.screen === "quiz") {
    const i = state.qi, qs = state.questions, q = qs[i], Q = q[lang] || q.en || q.hi;
    const sel = state.answers[i], pct = Math.round((i / qs.length) * 100);
    app.innerHTML = `
      <div class="pop">
        <div class="flex justify-between items-center text-xs text-neutral-500 mb-2"><span>${t.q} ${i + 1} ${t.of} ${qs.length} &middot; <b id="tm" class="text-green-700">${fmtT(Date.now() - state.startedAt)}</b></span><span class="truncate ml-3 flex-1 text-right">${esc(state.name)} &middot; ${esc(state.subName)}</span><button id="quit" aria-label="Quit test" class="ml-3 text-red-500 font-bold shrink-0">\u2715</button></div>
        <div class="h-1.5 rounded-full bg-green-100 overflow-hidden mb-6"><div class="h-full bg-green-600 transition-all duration-300" style="width:${pct}%"></div></div>
        <h2 class="text-lg font-semibold leading-snug mb-6">${esc(Q.q)}</h2>
        <div id="opts" class="flex flex-col gap-2.5 mb-7">
          ${Q.options.map((o, oi) => `<button data-i="${oi}" class="opt text-left px-4 py-3.5 rounded-xl border ${sel === oi ? "border-green-600 bg-green-600 text-white font-semibold" : "border-green-200 bg-white text-neutral-800 hover:border-green-500"}">${esc(o)}</button>`).join("")}
        </div>
        <div class="flex gap-2.5">${i > 0 ? `<button id="prevBtn" aria-label="Previous" class="px-6 py-3.5 rounded-full ${btnLine}">\u2190</button>` : ""}<button id="nextBtn" ${sel == null ? "disabled" : ""} class="flex-1 py-3.5 rounded-full ${btnMain} disabled:opacity-35 disabled:cursor-not-allowed">${i === qs.length - 1 ? t.submit : t.next}</button></div>
      </div>`;
    $("opts").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (!b) return; state.answers[i] = Number(b.dataset.i); render(); });
    if ($("prevBtn")) $("prevBtn").onclick = () => { state.qi--; render(); };
    $("quit").onclick = () => { if (confirm(lang === "hi" ? "Test chhod dein?" : "Quit this test?")) { clearInterval(window._tm); state.screen = "start"; render(); } };
    $("nextBtn").onclick = () => {
      if (state.answers[i] == null) return;
      if (i < qs.length - 1) { state.qi++; render(); } else { $("nextBtn").disabled = true; $("nextBtn").textContent = t.loading; submitTest(); }
    };
    return;
  }

  if (state.screen === "result") {
    const total = state.questions.length, pct = Math.round(state.score / total * 100);
    const same = results.filter(r => r.cls === state.cls && r.subjectKey === state.subKey);
    const rank = same.findIndex(r => r.id === state.resultId) + 1;
    app.innerHTML = `
      <div class="pop text-center py-6">
        <p class="text-neutral-500 text-sm mb-1">${t.result} &middot; ${esc(state.subName)}</p>
        <div class="text-6xl font-extrabold my-3 text-green-700">${state.score}<span class="text-2xl text-neutral-400">/${total}</span></div>
        <p class="text-lg font-semibold">${t.praise(pct)}</p>
        ${state.saveErr ? `<p class="mt-3 text-xs text-red-600 bg-red-50 border border-red-200 rounded-xl p-3">\u26A0 Result save nahi ho paya. Internet check karke "Dobara save karein" dabayein.</p>` : ""}
        ${state.timeMs ? `<p class="text-neutral-500 text-sm mt-1">Time: <b class="text-green-700">${fmtT(state.timeMs)}</b></p>` : ""}
        ${rank > 0 ? `<p class="text-neutral-500 text-sm mt-2">${t.rank}: <b class="text-green-700">#${rank}</b></p>` : ""}
        ${state.saveErr ? `<button id="retrySave" class="mt-4 px-5 py-2.5 rounded-full ${btnMain} text-sm">Dobara save karein</button>` : ""}
        <div class="flex gap-2 mt-6 justify-center"><button id="shareBtn" class="px-4 py-2 rounded-full ${btnLine} text-sm">Share</button><button id="revBtn" class="px-4 py-2 rounded-full ${btnLine} text-sm">${state.review ? "Hide" : "Review"} answers</button></div>
        ${state.review ? reviewHtml() : ""}
        <div class="flex gap-2.5 mt-8">
          <button id="goLb3" class="flex-1 py-3 rounded-full ${btnMain}">${t.viewLb}</button>
          <button id="retake" class="px-5 py-3 rounded-full ${btnLine}">${t.retake}</button>
        </div>
      </div>`;
    $("goLb3").onclick = () => { state.lbCls = ""; state.lbSub = ""; state.lbTab = "students"; state.lbSort = "latest"; state.metSeen = 0; state.screen = "leaderboard"; render(); };
    $("retake").onclick = () => { state.screen = "start"; render(); };
    $("revBtn").onclick = () => { state.review = !state.review; render(); };
    $("shareBtn").onclick = shareResult;
    if ($("retrySave")) $("retrySave").onclick = async () => { await saveResult(); render(); };
    return;
  }

  if (state.screen === "leaderboard") {
    const l = LB[lang];
    if (!loadedR) { app.innerHTML = `<p class="text-neutral-500 text-center py-16">${t.loading}</p>`; return; }
    const tab = state.lbTab || "students";
    const pc = r => Math.round(r.score / r.total * 100);
    const ini = n => (String(n).trim()[0] || "?").toUpperCase();
    const isMe = r => state.resultId && r.id === state.resultId;
    const inCls = results.filter(r => !state.lbCls || r.cls === state.lbCls);
    const subs = {}; inCls.forEach(r => { if (r.subjectKey) subs[r.subjectKey] = r.subject || r.subjectKey; });
    if (state.lbSub && !subs[state.lbSub]) state.lbSub = "";
    const list = inCls.filter(r => !state.lbSub || r.subjectKey === state.lbSub);
    const avgP = list.length ? Math.round(list.reduce((a, r) => a + pc(r), 0) / list.length) : 0;
    const chip = (k, label) => `<button data-s="${esc(k)}" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold border transition ${state.lbSub === k ? "bg-green-600 border-green-600 text-white" : "border-green-200 text-green-700 hover:bg-green-50"}">${esc(label)}</button>`;
    const tabBtn = (k, label) => `<button data-tab="${k}" class="flex-1 py-2.5 rounded-full text-sm font-bold transition ${tab === k ? "bg-green-600 text-white shadow" : "text-green-700"}">${label}</button>`;
    const filters = `
      <select id="fc" class="${inputCls} !py-2.5 text-sm mb-3"><option value="">${l.allCls}</option>${clsOptions(state.lbCls)}</select>
      <div id="chips" class="flex gap-2 overflow-x-auto pb-3 mb-2">${chip("", l.all)}${Object.keys(subs).map(k => chip(k, subs[k])).join("")}</div>`;
    const head = `<div class="pop flex p-1 rounded-full bg-green-50 border border-green-100 mb-5" id="tabs">${tabBtn("students", "\u{1F465} " + l.stu)}${tabBtn("toppers", "\u{1F3C6} " + l.top)}</div>`;
    let body = "";

    if (tab === "students") {
      body = `
        <div class="pop rounded-3xl p-5 mb-5 text-white bg-gradient-to-br from-green-700 via-green-600 to-green-500 shadow-lg shadow-green-200">
          <div class="text-sm font-semibold opacity-90">\u{1F465} ${l.stuTitle}</div>
          <div class="grid grid-cols-3 gap-3 mt-4 text-center">
            <div><div class="text-2xl font-extrabold">${list.length}</div><div class="text-[.7rem] opacity-80">${l.tests}</div></div>
            <div><div class="text-2xl font-extrabold">${new Set(list.map(r => String(r.name).trim().toLowerCase())).size}</div><div class="text-[.7rem] opacity-80">${l.stu}</div></div>
            <div><div class="text-2xl font-extrabold">${list.length ? avgP + "%" : "-"}</div><div class="text-[.7rem] opacity-80">${l.avg}</div></div>
          </div>
        </div>
        ${dbErr ? `<div class="mb-3 rounded-xl border border-red-200 bg-red-50 text-red-600 text-xs p-3">\u26A0 Leaderboard abhi load nahi ho paya. Internet check karke <button onclick="location.reload()" class="underline font-bold">dobara try karein</button>.</div>` : `<div class="mb-3 text-[.7rem] text-green-700 font-semibold">\u{1F7E2} Live &middot; ${results.length} results</div>`}
        ${filters}
        <div class="flex gap-2 mb-4">
          <input id="srch" placeholder="${l.search}" class="${inputCls} !py-2.5 text-sm flex-1 min-w-0">
          <button id="srt" class="shrink-0 px-4 rounded-xl border border-green-200 text-green-700 text-xs font-bold">${(state.lbSort || "latest") === "latest" ? "\u{1F552} " + l.latest : "\u{2B50} " + l.best}</button>
        </div>
        <div id="stList"></div>`;
    } else {
      const ch = list[0];
      const champ = {};
      SUBS.forEach(s => { let b = null; inCls.forEach(r => { if (r.subject === s && betterR(r, b)) b = r; }); if (!state.lbCls && toppers[s] && betterR(toppers[s], b)) b = toppers[s]; champ[s] = b; });
      const icon = { Maths: "\u{1F522}", Science: "\u{1F52C}", English: "\u{1F4D6}", Hindi: "\u0905" };
      const top3 = list.slice(0, 3);
      const pod = { 0: { h: 128, bg: "from-green-600 to-green-400", av: "w-16 h-16 text-2xl bg-green-600 text-white ring-4 ring-green-200" }, 1: { h: 92, bg: "from-green-400 to-green-300", av: "w-14 h-14 text-xl bg-green-500 text-white ring-4 ring-green-100" }, 2: { h: 66, bg: "from-green-300 to-green-200", av: "w-14 h-14 text-xl bg-green-400 text-white ring-4 ring-green-100" } };
      body = `${filters}` + (!ch ? `<p class="text-center text-neutral-500 py-12 border border-dashed border-green-200 rounded-2xl">${l.none}</p>` : `
        <div class="pop relative overflow-hidden rounded-3xl p-6 text-center text-white bg-gradient-to-br from-green-900 via-green-700 to-emerald-400 shadow-xl shadow-green-200 mt-2">
          <div class="absolute -top-10 -left-10 w-40 h-40 rounded-full bg-white/10 blur-2xl"></div>
          <div class="absolute -bottom-12 -right-8 w-44 h-44 rounded-full bg-yellow-300/20 blur-2xl"></div>
          <div class="relative">
            <div class="text-4xl floaty">\u{1F451}</div>
            <div class="text-[.7rem] tracking-[.25em] font-bold opacity-90 mt-1">${l.champ}${state.lbSub ? " \u00B7 " + esc(String(subs[state.lbSub]).toUpperCase()) : ""}</div>
            <div class="mx-auto mt-4 w-24 h-24 rounded-full bg-white text-green-700 text-5xl font-extrabold grid place-items-center ring-8 ring-yellow-300/60 shine">${esc(ini(ch.name))}</div>
            <div class="text-2xl font-extrabold mt-4 break-words">${esc(ch.name)}</div>
            <div class="text-sm opacity-90">${esc(clsLabel(ch.cls))} \u00B7 ${esc(ch.subject || "")}</div>
            <div class="flex justify-center flex-wrap gap-2 mt-5">
              <span class="px-4 py-1.5 rounded-full bg-white text-green-800 font-extrabold text-sm">${ch.score}/${ch.total}</span>
              <span class="px-4 py-1.5 rounded-full bg-white/20 font-bold text-sm">${pc(ch)}%</span>
              ${ch.timeMs ? `<span class="px-4 py-1.5 rounded-full bg-white/20 font-bold text-sm">\u23F1 ${fmtT(ch.timeMs)}</span>` : ""}
            </div>
          </div>
        </div>
        <h3 class="text-sm font-bold text-green-700 mt-8 mb-1">${l.podium}</h3>
        <div class="flex items-end justify-center gap-2.5 mt-4 mb-8">
          ${[1, 0, 2].map(idx => { const r = top3[idx]; if (!r) return ""; const p = pod[idx];
            return `<div class="pop flex-1 max-w-[150px] flex flex-col items-center" style="animation-delay:${idx * 120}ms">
              ${idx === 0 ? '<div class="text-2xl -mb-1">\u{1F451}</div>' : ""}
              <div class="${p.av} rounded-full grid place-items-center font-bold">${esc(ini(r.name))}</div>
              <div class="font-semibold text-sm mt-2 max-w-full truncate ${isMe(r) ? "text-green-700" : ""}">${esc(r.name)}</div>
              <div class="text-[.68rem] text-neutral-500 max-w-full truncate">${esc(clsLabel(r.cls))} &middot; ${esc(r.subject || "")}</div>
              <div class="font-bold text-green-700 text-sm mt-0.5">${r.score}/${r.total} &middot; ${pc(r)}%</div>
              ${r.timeMs ? `<div class="text-[.68rem] text-neutral-500">${fmtT(r.timeMs)}</div>` : ""}
              <div class="grow w-full mt-2 rounded-t-2xl bg-gradient-to-b ${p.bg} grid place-items-start justify-center pt-2 text-white font-extrabold text-2xl" style="height:${p.h}px;animation-delay:${idx * 120 + 150}ms">${idx + 1}</div>
            </div>`; }).join("")}
        </div>
        <h3 class="text-sm font-bold text-green-700 mb-3">\u{1F31F} ${l.subChamp}</h3>
        <div class="grid grid-cols-2 gap-3">
          ${SUBS.map(s => { const r = champ[s]; return `<div class="pop rounded-2xl border border-green-100 bg-gradient-to-b from-green-50 to-white p-4 text-center shadow-sm">
            <div class="w-10 h-10 mx-auto rounded-full bg-green-600 text-white grid place-items-center text-lg font-bold">${icon[s]}</div>
            <div class="text-[.7rem] font-bold text-green-700 mt-2">${s}</div>
            ${r ? `<div class="font-bold text-sm mt-1 truncate">${esc(r.name)}</div><div class="text-[.68rem] text-neutral-500">${esc(clsLabel(r.cls))}</div><div class="font-extrabold text-green-700 mt-1">${r.score}/${r.total}</div>${r.timeMs ? `<div class="text-[.65rem] text-neutral-500">${fmtT(r.timeMs)}</div>` : ""}` : `<div class="text-xs text-neutral-400 mt-2">&mdash;</div>`}
          </div>`; }).join("")}
        </div>`);
    }
    app.innerHTML = head + body + `<button id="backStart" class="block w-full text-center text-sm text-green-700 hover:text-green-900 mt-7">&larr; ${l.back}</button>`;

    const drawStudents = () => {
      const box = $("stList"); if (!box) return;
      const q = (($("srch") || {}).value || "").trim().toLowerCase();
      const rankOf = new Map(list.map((r, i) => [r.id, i + 1]));
      const liveHtml = "";
      let rows = list.filter(r => !q || String(r.name).toLowerCase().includes(q));
      if ((state.lbSort || "latest") === "latest") rows = rows.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      if (!rows.length) { box.innerHTML = liveHtml + `<p class="text-center text-neutral-500 py-12 border border-dashed border-green-200 rounded-2xl">${l.none}</p>`; return; }
      box.innerHTML = liveHtml + `<div class="rounded-2xl border border-green-100 overflow-hidden bg-white shadow-sm">` + rows.map((r, i) => {
        const p = pc(r), rk = rankOf.get(r.id), dt = r.createdAt ? new Date(r.createdAt).toLocaleDateString("en-IN", { day: "numeric", month: "short" }) : "";
        const col = p >= 75 ? "text-green-700" : p >= 50 ? "text-amber-600" : "text-red-500";
        return `<div data-nm="${esc(String(r.name).trim().toLowerCase())}" class="cursor-pointer flex items-center gap-3 px-4 py-3 ${i ? "border-t border-green-50" : ""} ${isMe(r) ? "bg-green-50 ring-2 ring-inset ring-green-500" : ""}">
          <div class="w-10 h-10 rounded-full ${rk <= 3 ? "bg-green-600 text-white" : "bg-green-100 text-green-700"} grid place-items-center font-bold shrink-0">${esc(ini(r.name))}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5"><span class="font-semibold text-sm truncate">${esc(r.name)}</span>${isMe(r) ? `<span class="text-[.6rem] px-1.5 py-0.5 rounded-full bg-green-600 text-white font-semibold">${l.you}</span>` : ""}${rk <= 3 ? `<span>${medal(rk - 1)}</span>` : ""}</div>
            <div class="text-[.68rem] text-neutral-500 truncate">${esc(clsLabel(r.cls))} &middot; ${esc(r.subject || "")}${dt ? " &middot; " + dt : ""}</div>
            <div class="h-1.5 rounded-full bg-green-100 mt-1.5 overflow-hidden"><div class="bar h-full rounded-full bg-gradient-to-r from-green-600 to-green-400" style="width:${p}%"></div></div>
          </div>
          <div class="text-right shrink-0"><div class="font-extrabold text-base ${col}">${r.score}<span class="text-xs text-neutral-400 font-semibold">/${r.total}</span></div><div class="text-[.68rem] font-semibold ${col}">${p}%</div>${r.timeMs ? `<div class="text-[.65rem] text-neutral-500">${fmtT(r.timeMs)}</div>` : ""}</div>
        </div>`; }).join("") + `</div>`;
      const me = box.querySelector(".ring-inset"); if (me && !state.metSeen) { state.metSeen = 1; me.scrollIntoView({ block: "center" }); }
    };
    $("tabs").onclick = e => { const b = e.target.closest("[data-tab]"); if (b) { state.lbTab = b.dataset.tab; render(); } };
    const fc = $("fc"); if (fc) fc.onchange = e => { state.lbCls = e.target.value; state.lbSub = ""; render(); };
    const chips = $("chips"); if (chips) chips.onclick = e => { const b = e.target.closest("[data-s]"); if (!b) return; state.lbSub = b.dataset.s; render(); };
    if (tab === "students") {
      $("srch").value = state.q || ""; $("srch").oninput = e => { state.q = e.target.value; drawStudents(); };
      $("srt").onclick = () => { state.lbSort = (state.lbSort || "latest") === "latest" ? "best" : "latest"; render(); };
      window.__drawStudents = drawStudents; drawStudents();
      $("stList").onclick = e => {
        const row = e.target.closest("[data-nm]"); if (!row) return;
        const nx = row.nextElementSibling; if (nx && nx.classList.contains("hist")) { nx.remove(); return; }
        const h = results.filter(x => String(x.name).trim().toLowerCase() === row.dataset.nm).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        row.insertAdjacentHTML("afterend", `<div class="hist bg-green-50/60 px-4 py-2 text-xs border-t border-green-100"><div class="font-bold text-green-700 mb-1">${esc(h[0] ? h[0].name : "")} - ${h.length} tests</div>` + h.map(x => `<div class="flex justify-between py-1"><span>${esc(x.subject || "")} &middot; ${esc(clsLabel(x.cls))} &middot; ${x.createdAt ? new Date(x.createdAt).toLocaleDateString("en-IN", { day: "numeric", month: "short" }) : ""}</span><b>${x.score}/${x.total} &middot; ${pc(x)}%</b></div>`).join("") + `</div>`);
      };
    }
    $("backStart").onclick = () => { state.screen = "start"; render(); };
  }
}

async function saveResult() {
  const p = state.pending; if (!p) return; state.saveErr = "";
  try {
    const id = state.pendingId || push(ref(db, "testResults")).key; state.pendingId = id;
    await set(ref(db, "testResults/" + id), p); state.resultId = id;
    try { await runTransaction(ref(db, "testToppers/" + p.subject), cur => (!cur || betterR(p, cur)) ? { name: p.name, cls: p.cls, subject: p.subject, score: p.score, total: p.total, timeMs: p.timeMs, createdAt: p.createdAt } : cur); } catch (e2) {}
  } catch (e) { state.resultId = null; state.saveErr = (e && (e.code || e.message)) || "error"; }
}
async function submitTest() {
  if (state.submitting) return; state.submitting = true; clearInterval(window._tm);
  try { if (state.liveId) remove(ref(db, "testLive/" + state.liveId)).catch(() => {}); state.liveId = null; } catch (e) {}
  let score = 0;
  state.questions.forEach((q, i) => { const Q = q[lang] || q.en || q.hi; if (state.answers[i] === Number(Q.correct)) score++; });
  state.score = score;
  const timeMs = Math.max(1000, Date.now() - (state.startedAt || Date.now()));
  state.timeMs = timeMs;
  const total = state.questions.length;
  state.pendingId = null;
  state.pending = { name: state.name.trim().replace(/\s+/g, " "), cls: state.cls, subject: state.subName, subjectKey: state.subKey, medium: lang, score, total, timeMs, createdAt: Date.now() };
  await saveResult();
  state.screen = "result";
  render();
  if (score / total >= 0.75) confetti();
}
function reviewHtml() {
  return `<div class="text-left mt-6 space-y-3">` + state.questions.map((q, i) => { const Q = q[lang] || q.en || q.hi, a = state.answers[i], c = Number(Q.correct), ok = a === c;
    return `<div class="rounded-xl border ${ok ? "border-green-200 bg-green-50/50" : "border-red-200 bg-red-50/50"} p-3 text-sm"><div class="font-semibold">${i + 1}. ${esc(Q.q)}</div><div class="mt-1 ${ok ? "text-green-700" : "text-red-600"}">${ok ? "\u2714" : "\u2718"} ${esc(Q.options[a] ?? "-")}</div>${ok ? "" : `<div class="text-green-700">\u2714 ${esc(Q.options[c] ?? "")}</div>`}</div>`; }).join("") + `</div>`;
}
function shareResult() {
  const txt = `Maine Amrit Tiwari Test (${state.subName}) mein ${state.score}/${state.questions.length} score kiya! Aap bhi try karein: https://www.amritbhai.shop/test.html`;
  if (navigator.share) navigator.share({ text: txt }).catch(() => {}); else window.open("https://wa.me/?text=" + encodeURIComponent(txt), "_blank");
}
document.addEventListener("keydown", e => {
  if (state.screen !== "quiz" || e.ctrlKey || e.metaKey || e.altKey) return;
  const i = state.qi, q = state.questions[i], Q = q[lang] || q.en || q.hi;
  if (/^[1-9]$/.test(e.key) && +e.key <= Q.options.length) { state.answers[i] = +e.key - 1; render(); }
  else if (e.key === "ArrowRight" && state.answers[i] != null && $("nextBtn")) $("nextBtn").click();
  else if (e.key === "ArrowLeft" && i > 0) { state.qi--; render(); }
});
window.addEventListener("beforeunload", e => { if (state.screen === "quiz") { e.preventDefault(); e.returnValue = ""; } });

render();
</script>
</body>
</html>
