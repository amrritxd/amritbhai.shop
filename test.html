/* translucent nav bar */
header,body.noselect header{position:sticky;top:0;padding-top:var(--sp);margin-top:calc(-1*var(--sp));background:rgba(249,249,251,.72)!important;-webkit-backdrop-filter:saturate(180%) blur(22px)!important;backdrop-filter:saturate(180%) blur(22px)!important;border-bottom:.5px solid var(--sep)!important}
#logoImg{border:none!important;box-shadow:0 0 0 .5px var(--sep),0 2px 8px rgba(0,0,0,.12)!important}
#tagline{color:#8e8e93!important}
/* cards = inset grouped */
.glass,body.noselect .glass{background:#fff!important;border:none!important;border-radius:22px!important;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -12px rgba(0,0,0,.12)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.gtext{background:none!important;-webkit-text-fill-color:initial!important;color:var(--ac)!important}
input,select,textarea{font-size:16px!important;border-radius:14px!important;background:rgba(118,118,128,.12)!important;border:none!important;outline:none!important;transition:box-shadow .2s}
input:focus,select:focus{box-shadow:0 0 0 3px var(--acs)!important}
/* buttons */
.btnm,body.noselect .btnm{background:var(--ac)!important;color:#fff!important;border:none!important;border-radius:16px!important;font-weight:600!important;box-shadow:0 8px 20px -8px var(--ac)!important;transition:transform .15s,opacity .15s}
.btnm:active{transform:scale(.97);opacity:.88}
button:disabled{opacity:.4!important;box-shadow:none!important}
/* options + subject tiles */
.opt,.sub{border:none!important;border-radius:16px!important;background:#fff!important;box-shadow:0 0 0 .5px var(--sep),0 1px 3px rgba(0,0,0,.05)!important}
.opt.on{background:var(--ac)!important;color:#fff!important;box-shadow:0 10px 22px -10px var(--ac)!important}
.optkey,body.noselect .optkey{background:var(--acs)!important;color:var(--ac)!important;border-radius:10px}
.opt.on .optkey{background:rgba(255,255,255,.25)!important;color:#fff!important}
.pbar,body.noselect .pbar{background:var(--ac)!important;box-shadow:none!important;border-radius:99px}
.actbar{background:linear-gradient(transparent,var(--bg) 40%)!important}
/* language switch */
.lg{border:none!important;background:rgba(118,118,128,.14)!important;box-shadow:none!important}
.lg .th{background:#fff!important;box-shadow:0 2px 6px rgba(0,0,0,.18)!important}
#bellBtn{border:none!important;background:rgba(118,118,128,.14)!important;box-shadow:none!important}
/* iOS tab bar: edge to edge, frosted */
#bnav{left:0!important;right:0!important;bottom:0!important;width:100%!important;max-width:none!important;transform:none!important;border-radius:0!important;padding:6px 8px calc(6px + var(--sb))!important;background:rgba(249,249,251,.78)!important;-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);box-shadow:0 -.5px 0 var(--sep)!important}
body.noselect #bnav{transform:translateY(160%)!important}
#bnav .in{max-width:680px;margin:0 auto}
#bnav .dv{display:none}
#bnav button{flex-direction:column!important;height:50px!important;gap:3px!important;font-size:.64rem!important;font-weight:600;color:#8e8e93!important;background:transparent!important;border:none!important}
#bnav button.on{color:var(--ac)!important;background:transparent!important}
#bnav button svg{width:24px!important;height:24px!important}
body{padding-bottom:calc(66px + var(--sb))!important}
/* bottom sheets */
.sheet{border-radius:28px 28px 0 0!important;padding-bottom:calc(24px + var(--sb))!important;box-shadow:0 -10px 40px rgba(0,0,0,.18)!important}
.sheet-bg{background:rgba(0,0,0,.32)!important;-webkit-backdrop-filter:blur(8px)!important;backdrop-filter:blur(8px)!important}
footer{background:transparent!important;border:none!important}

/* ===== NEW class picker + subject rows ===== */
.sec-h{font-size:1.12rem;font-weight:700;letter-spacing:-.02em;color:#1c1c1e}
.sec-s{font-size:.78rem;color:#8e8e93;margin:0 1px 12px}
.clsel{font-size:.75rem;font-weight:700;padding:4px 11px;border-radius:99px;background:rgba(118,118,128,.14);color:#8e8e93;transition:all .25s}
.clsel.on{background:var(--acs);color:var(--ac)}
#cl{outline:none}
.cg{margin-top:9px}.cg:first-child{margin-top:2px}
.cgh{display:flex;align-items:center;gap:5px;font-size:.7rem;font-weight:600;color:#8e8e93;margin:0 2px 5px}
.cgr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ct{height:38px;border-radius:12px;border:none!important;background:#f2f2f7!important;color:#1c1c1e!important;font-weight:700;font-size:.95rem;display:grid;place-items:center;position:relative;box-shadow:none!important;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s,color .2s,box-shadow .2s}

.ct:active{transform:scale(.9)!important}
.ct[aria-checked=true]{background:linear-gradient(160deg,var(--ac),var(--ac2))!important;color:#fff!important;transform:scale(1.05);box-shadow:0 8px 14px -6px var(--ac)!important}
.ct[aria-checked=true]::after{content:"\2713";position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:#fff;color:var(--ac);font-size:.55rem;font-weight:800;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.22);animation:chipPop .3s ease}
.sr-list{display:flex;flex-direction:column;gap:10px}
.sr{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px 12px 12px;border-radius:24px;background:#fff!important;box-shadow:0 0 0 .5px var(--sep),0 8px 20px -12px rgba(0,0,0,.25)!important;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.sr:active{transform:scale(.97)!important}
.sr-ic{flex:none;position:relative;width:60px;height:60px;border-radius:19px;display:grid;place-items:center;font-size:1.75rem;color:#fff;font-weight:700;background:linear-gradient(150deg,var(--a),var(--b));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 18px -8px var(--b)}
.sr-ic::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.38),transparent 55%)}
.sr-tx{flex:1;min-width:0;display:flex;flex-direction:column}
.sr-tx b{font-size:1.06rem;font-weight:700;color:#1c1c1e;line-height:1.2}
.sr-tx i{font-style:normal;font-size:.76rem;font-weight:600;color:var(--b);margin-top:2px}
.sr-tx em{font-style:normal;font-size:.7rem;color:#8e8e93;margin-top:3px}
.sr-go{display:block;padding:8px 16px;border-radius:99px;background:var(--acs);color:var(--ac);font-weight:700;font-size:.82rem}
.sr-ring{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--b) calc(var(--p)*1%),#e5e5ea 0)}
.sr-ring u{text-decoration:none;width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:.66rem;font-weight:800;color:#1c1c1e}

/* ===== compact v2 ===== */
.cg{margin-top:6px}.cg:first-child{margin-top:0}
.cgh{font-size:.66rem;margin:0 2px 3px}
.cgr{gap:5px}
.ct{height:30px;border-radius:10px;font-size:.82rem}

.ct[aria-checked=true]{transform:scale(1.04);box-shadow:0 6px 12px -5px var(--ac)!important}
.ct[aria-checked=true]::after{width:13px;height:13px;top:-4px;right:-4px;font-size:.46rem}
.sec-h{font-size:1rem}.sec-s{font-size:.72rem;margin-bottom:8px}
.sr-list{gap:7px}
.sr{gap:10px;padding:8px 10px 8px 8px;border-radius:18px}
.sr-ic{width:42px;height:42px;border-radius:13px;font-size:1.25rem}
.sr-tx b{font-size:.94rem}
.sr-tx i{font-size:.68rem;margin-top:1px}
.sr-tx em{font-size:.64rem;margin-top:1px}
.sr-go{padding:5px 12px;font-size:.74rem}
.sr-ring{width:38px;height:38px}.sr-ring u{width:30px;height:30px;font-size:.58rem}

/* ===== style v3: segmented class + app-icon subjects ===== */
.sec-h{font-size:.98rem}
.sg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:2px;border-radius:11px;background:rgba(118,118,128,.14);margin-bottom:8px}
.sg button{height:28px;border-radius:9px;font-size:.74rem;font-weight:600;color:#3c3c43;background:transparent!important;border:none!important;box-shadow:none!important;transition:background .2s,box-shadow .2s}
.sg button.on{background:#fff!important;color:#1c1c1e;box-shadow:0 2px 6px rgba(0,0,0,.15),0 0 0 .5px rgba(0,0,0,.05)!important}
.cgr2{display:flex;gap:7px}.cgr2.hid{display:none}
.cgr2 .ct{flex:1;height:40px;border-radius:13px;font-size:1rem}

.cgn{font-size:.68rem;color:#8e8e93;margin:6px 2px 0}
.ap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:12px 6px;padding-top:4px}
.ap{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;background:none!important;border:none!important;box-shadow:none!important;padding:2px 0}
.ap-ic{position:relative;width:58px;height:58px;border-radius:17px;display:grid;place-items:center;font-size:1.6rem;font-weight:700;color:#fff;background:linear-gradient(150deg,var(--a),var(--b));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 9px 14px -7px var(--b);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.ap-ic::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.36),transparent 55%)}
.ap:active .ap-ic{transform:scale(.88)}
.ap-bd{position:absolute;z-index:2;top:-6px;right:-7px;min-width:22px;height:20px;padding:0 5px;border-radius:99px;background:#ff3b30;color:#fff;font-size:.6rem;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.ap b{font-size:.76rem;font-weight:600;color:#1c1c1e;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap em{font-style:normal;font-size:.62rem;color:#8e8e93;margin-top:-3px}

/* ===== style v4: iOS wheel + swipe cards ===== */
.wh-wrap{position:relative;height:120px;border-radius:20px;background:rgba(118,118,128,.10);overflow:hidden}
.wh-band{position:absolute;left:8px;right:8px;top:40px;height:40px;border-radius:13px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.05)}
.wh{position:relative;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;padding:40px 0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent)}
.wi{display:block;width:100%;height:40px;scroll-snap-align:center;scroll-snap-stop:always;font-size:1.08rem;font-weight:600;color:#3c3c43!important;background:none!important;border:none!important;box-shadow:none!important;border-radius:0!important;transition:color .15s}
.wi small{font-size:.68rem;font-weight:500;opacity:.7}
.wi.mid{color:var(--ac)!important;font-weight:700}
.cgn{font-size:.7rem;color:#8e8e93;text-align:center;margin:7px 0 0}
.tc-row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:4px 20px 16px;scroll-padding:0 20px}
.tc{flex:0 0 76%;max-width:270px;scroll-snap-align:start;position:relative;overflow:hidden;text-align:left;height:168px;border-radius:26px;padding:15px 16px;color:#fff!important;background:linear-gradient(145deg,var(--a),var(--b))!important;box-shadow:0 18px 28px -16px var(--b)!important;display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.tc:active{transform:scale(.96)!important}
.tc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 45%);pointer-events:none}
.tc-bg{position:absolute;right:-8px;bottom:-26px;font-size:7.2rem;line-height:1;opacity:.2;transform:rotate(-12deg)}
.tc-top{align-self:flex-start;font-size:.64rem;font-weight:700;background:rgba(255,255,255,.24);padding:3px 10px;border-radius:99px}
.tc b{margin-top:auto;font-size:1.55rem;font-weight:800;letter-spacing:-.02em;line-height:1.05;position:relative}
.tc i{font-style:normal;font-size:.74rem;opacity:.93;margin-top:3px;position:relative}
.tc-bar{display:block;height:4px;border-radius:9px;background:rgba(255,255,255,.3);margin-top:8px;overflow:hidden;position:relative}
.tc-bar span{display:block;height:100%;background:#fff;border-radius:9px}
.tc-ft{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font-size:.76rem;font-weight:700;position:relative}
.tc-ft u{text-decoration:none;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--b);display:grid;place-items:center;font-size:.95rem;font-weight:800;box-shadow:0 4px 10px -3px rgba(0,0,0,.3)}

/* ===== v5: subject wheel card, new Toppers + Students style ===== */
.tc.sbc{flex:none;width:100%;max-width:none;height:128px;padding:13px 15px;border-radius:24px}
.tc.sbc b{font-size:1.4rem}.tc.sbc .tc-ft{margin-top:6px}.tc.sbc .tc-ft u{width:26px;height:26px;font-size:.85rem}.tc.sbc .tc-bar{margin-top:6px}.tc.sbc .tc-bg{font-size:6rem;bottom:-22px}
.tpx{position:relative;display:block;width:100%;text-align:left;overflow:hidden;border-radius:30px;padding:16px;color:#fff;background:radial-gradient(120% 90% at 100% 0,rgba(251,191,36,.45),transparent 55%),linear-gradient(155deg,#18181b,#2b2108 62%,#78350f);box-shadow:0 22px 34px -18px rgba(180,83,9,.85),inset 0 1px 0 rgba(255,255,255,.14);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.tpx:active{transform:scale(.97)}
.tpx-glow{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.12) 50%,transparent 65%);background-size:250% 100%;animation:sk 3.4s linear infinite}
.tpx-hd{display:flex;align-items:center;justify-content:space-between;position:relative}
.tpx-pill{font-size:.64rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:99px;background:linear-gradient(135deg,#fde68a,#f59e0b);color:#451a03}
.tpx .th-trophy{font-size:2rem}
.tpx-me{display:flex;align-items:center;gap:13px;margin:12px 0 13px;position:relative}
.tpx-av{position:relative;flex:none;width:68px;height:68px;border-radius:50%;padding:3px;background:conic-gradient(#fde68a,#f59e0b,#fff7c2,#f59e0b,#fde68a)}
.tpx-av img,.tpx-ini{width:100%!important;height:100%!important;border-radius:50%;object-fit:cover;border:2px solid #18181b!important;display:grid;place-items:center;background:#3f3f46;color:#fde68a;font-weight:800;font-size:1.4rem}
.tpx-nm{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;line-height:1.15;background:linear-gradient(90deg,#fff,#fde68a,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpx-sub{font-size:.7rem;font-weight:600;color:#fcd34d;margin-top:3px}
.tpx-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;position:relative}
.tpx-t{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:15px;background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16);animation:thChip .5s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:calc(.4s + var(--i)*.12s)}
.tpx-t>span{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:.95rem;background:linear-gradient(150deg,var(--a),var(--b))}
.tpx-t em{display:block;font-style:normal;font-size:.62rem;color:rgba(255,255,255,.7);font-weight:600}
.tpx-t b{font-size:.8rem;font-weight:800;color:#fff}
.tpx>.text-\[\.65rem\]{position:relative;margin-top:9px;color:#fcd34d!important}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tt{position:relative;overflow:hidden;min-height:128px;border-radius:24px;padding:12px;color:#fff;display:flex;flex-direction:column;background:linear-gradient(150deg,var(--a),var(--b));box-shadow:0 16px 24px -16px var(--b)}
.tt::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.26),transparent 50%);pointer-events:none}
.tt-bg{position:absolute;right:-6px;bottom:-14px;font-size:5rem;line-height:1;opacity:.2;transform:rotate(-12deg)}
.tt-top{align-self:flex-start;font-size:.64rem;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.25);position:relative;z-index:1}
.tt b{margin-top:auto;font-size:1rem;font-weight:800;line-height:1.15;letter-spacing:-.01em;position:relative;z-index:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt i{font-style:normal;font-size:.7rem;opacity:.92;position:relative;z-index:1}
.tt-sc{margin-top:6px;align-self:flex-start;font-size:.64rem;font-weight:700;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.2);position:relative;z-index:1}
.tt-no{opacity:.85;font-size:.8rem!important;white-space:normal!important}
.sx-hd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sx-st{border-radius:22px;padding:13px 6px;text-align:center;color:#fff;background:linear-gradient(150deg,var(--a),var(--b));box-shadow:0 14px 20px -12px var(--b),inset 0 1px 0 rgba(255,255,255,.4)}
.sx-st b{display:block;font-size:1.5rem;font-weight:800;line-height:1.1}
.sx-st span{font-size:.64rem;font-weight:600;opacity:.92}
.sx-list{display:flex;flex-direction:column;gap:8px}
.sx{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:24px;background:#fff;cursor:pointer;box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 10px 20px -14px rgba(0,0,0,.3);transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
.sx:active{transform:scale(.97)}
.sx.me{box-shadow:0 0 0 2px #16a34a,0 10px 20px -12px rgba(22,163,74,.6);background:#f0fdf4}
.sx-ring{position:relative;flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#e5e5ea 0)}
.sx-ring>img,.sx-ring>div{width:46px!important;height:46px!important;border-radius:50%;object-fit:cover;border:2px solid #fff!important;display:grid;place-items:center;font-weight:800;background:#f2f2f7;color:#1c1c1e}
.sx-rk{position:absolute;bottom:-5px;right:-5px;min-width:21px;height:21px;padding:0 4px;border-radius:99px;background:#1c1c1e;color:#fff;font-size:.6rem;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.sx-nm{font-size:.92rem;font-weight:700;color:#1c1c1e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sx-you{font-size:.58rem;font-weight:700;padding:2px 7px;border-radius:99px;background:#16a34a;color:#fff}
.sx-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.sx-tags span{font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:99px}
.sx-dt{font-size:.62rem;font-weight:600;color:#8e8e93;margin-top:3px}
.sx-sc{flex:none;text-align:right}
.sx-big{font-size:1.3rem;font-weight:800;line-height:1}
.sx-big small{font-size:.66rem;font-weight:600;color:#8e8e93}
.sx-pc{display:inline-block;margin-top:4px;font-size:.64rem;font-weight:800;padding:2px 8px;border-radius:99px}
.sx-tm{font-size:.6rem;color:#8e8e93;margin-top:2px}

/* ===== v6: toppers upgrade ===== */
.sec3{display:flex;align-items:center;gap:8px;font-size:1.05rem;font-weight:800;letter-spacing:-.02em;color:#1c1c1e}
.sec3::before{content:"";width:5px;height:20px;border-radius:9px;background:linear-gradient(#fbbf24,#d97706)}
.sec3d{font-size:.72rem;color:#8e8e93;margin:2px 0 11px 13px}
.hof{display:flex;align-items:center;gap:13px;margin-bottom:16px;padding:14px;border-radius:26px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#f59e0b,#ea580c 55%,#be123c);box-shadow:0 18px 28px -16px #ea580c}
.hof::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.3),transparent 55%);pointer-events:none}
.hof-l{position:relative;flex:none;padding-top:14px}
.hof-cr{position:absolute;top:-2px;left:50%;transform:translateX(-50%) rotate(-8deg);font-style:normal;font-size:1.5rem;animation:thFloat 2.4s ease-in-out infinite;z-index:2}
.hof-av{width:60px;height:60px;border-radius:50%;padding:3px;background:#fff}
.hof-av img,.hof-av .tpx-ini{width:100%!important;height:100%!important;border-radius:50%;object-fit:cover;border:0!important;display:grid;place-items:center;background:#fde68a;color:#92400e;font-weight:800;font-size:1.3rem}
.hof em{display:block;font-style:normal;font-size:.6rem;font-weight:800;letter-spacing:.1em;opacity:.9}
.hof b{display:block;font-size:1.1rem;font-weight:800;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hof i{font-style:normal;font-size:.7rem;font-weight:600;opacity:.95}

async function saveResult() {
  const p = state.pending; if (!p) return; state.saveErr = ""; if (_goneHit(p.name, p.cls, "", p.createdAt)) return;
  try {
    const id = state.pendingId || push(ref(db, "testResults")).key; state.pendingId = id;
    await set(ref(db, "testResults/" + id), p); state.resultId = id;
    try { tgResult(p, id); } catch (e2) {}
  } catch (e) { state.resultId = null; state.saveErr = (e && (e.code || e.message)) || "error";
    try { tgOnce("rf_" + p.createdAt, () => tgText("⚠️ <b>Result SAVE nahi hua</b>\n👤 " + tgE(p.name) + " · " + tgE(clsLabelEn(p.cls)) + " · " + tgE(p.subject) + "\n✅ " + p.score + "/" + p.total + "\nError: " + tgE(state.saveErr))); } catch (e2) {} }
}
async function submitTest() {
  if (state.submitting) return; state.submitting = true; clearInterval(window._tm);
  try { if (state.liveId) remove(ref(db, "testLive/" + state.liveId)).catch(() => {}); state.liveId = null; } catch (e) {}
  let score = 0;
  state.questions.forEach((q, i) => { const Q = q.Q; if (state.answers[i] === Number(Q.correct)) score++; });
  state.score = score;
  const timeMs = Math.max(1000, Date.now() - (state.startedAt || Date.now()));
  state.timeMs = timeMs;
  const total = state.questions.length;
  if (total > 0 && score >= total) markMastered(state.name, state.subName, state.cls);
  state.pendingId = null;
  state.pending = { name: state.name.trim().replace(/\s+/g, " "), cls: state.cls, subject: state.subName, subjectKey: state.subKey, medium: state.testLang || lang, score, total, timeMs, leaves: state.leaves || 0, createdAt: Date.now() };
  await saveResult();
  state.screen = "result";
  render();
  if (score / total >= 0.75) confetti();
  try { const cur = fullTopperOf(state.cls); if (score >= total && cur && nk(cur.name) === nk(state.name)) { podBurst(); setTimeout(() => { const h = document.querySelector("#app .th-trophy"); if (h) { const b = h.getBoundingClientRect(); firework(b.left + b.width / 2, b.top + b.height / 2, 36, ["#facc15", "#fbbf24", "#f59e0b", "#ffffff", "#4ade80"]); } }, 700); } } catch (e) {}
}

    if (loadedR && results.length) { if (!photoMap.size && tries < 6) return setTimeout(() => wait(tries + 1), 500); return show(); }
    if (tries < 30) setTimeout(() => wait(tries + 1), 500);
  }, 2000);
})();

render();


</script>
<script>
(function(){

  function close(){v.classList.remove("show");clearTimeout(t);t=setTimeout(function(){v.classList.remove("on");document.documentElement.style.overflow=""},280)}
