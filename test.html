/* ===== ROCKET RACE (kids top 3) ===== */
@keyframes rkUp{0%{transform:translateY(19rem) scale(.7);opacity:0}12%{opacity:1}68%{transform:translateY(-.9rem) scale(1.04)}85%{transform:translateY(.25rem)}100%{transform:none;opacity:1}}
@keyframes rkHover{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-7px) rotate(1.5deg)}}
@keyframes rkFlame{from{transform:scaleY(.65) scaleX(.9);opacity:.85}to{transform:scaleY(1.25) scaleX(1.08);opacity:1}}
@keyframes rkTrail{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:scaleY(1)}}
@keyframes rkCloud{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
@keyframes rkTwinkle{0%{opacity:.35}100%{opacity:1}}
@keyframes rkPop{0%{transform:scale(0) rotate(-20deg);opacity:0}70%{transform:scale(1.2) rotate(4deg);opacity:1}100%{transform:none;opacity:1}}
.rk-sky{position:relative;overflow:hidden;border-radius:1.6rem;padding:.9rem .5rem .8rem;background:linear-gradient(180deg,#1e1b4b 0%,#4c1d95 40%,#be185d 76%,#fb923c 100%);box-shadow:0 20px 44px -14px rgba(76,29,149,.6),inset 0 1px 0 rgba(255,255,255,.18);isolation:isolate}
.rk-sky::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(2px 2px at 10% 18%,#fff 50%,transparent 52%),radial-gradient(1.5px 1.5px at 24% 8%,#fde68a 50%,transparent 52%),radial-gradient(2px 2px at 40% 26%,#fff 50%,transparent 52%),radial-gradient(1.5px 1.5px at 58% 10%,#fff 50%,transparent 52%),radial-gradient(2px 2px at 72% 30%,#fde68a 50%,transparent 52%),radial-gradient(1.5px 1.5px at 86% 14%,#fff 50%,transparent 52%),radial-gradient(1.5px 1.5px at 94% 40%,#fff 50%,transparent 52%),radial-gradient(1.5px 1.5px at 6% 46%,#fff 50%,transparent 52%);animation:rkTwinkle 1.8s ease-in-out infinite alternate}
.rk-moon{position:absolute;top:8px;left:12px;font-size:1.7rem;animation:rkHover 4s ease-in-out infinite}
.rk-planet{position:absolute;top:12px;right:14px;font-size:1.4rem;animation:rkHover 5s ease-in-out 1s infinite}
.rk-fly{position:relative;height:17.2rem;overflow:hidden}
.rk-cloud{position:absolute;bottom:-8px;font-size:2.2rem;opacity:.92;animation:rkCloud 7s ease-in-out infinite alternate;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}
.rk-up{position:absolute;left:50%;bottom:var(--b);width:var(--w);margin-left:calc(var(--w) / -2);animation:rkUp 1.35s cubic-bezier(.2,.9,.25,1) var(--d) both;z-index:2}
.rk-hover{position:relative;animation:rkHover 2.6s ease-in-out calc(var(--d) + 1.4s) infinite}
.rk-hover svg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
.rk-win{position:absolute;left:50%;top:calc(var(--w) * .536);width:calc(var(--w) * .4);height:calc(var(--w) * .4);transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;background:#e0f2fe;border:2px solid #fff;display:grid;place-items:center;font-weight:800;color:#0369a1;font-size:calc(var(--w) * .18)}
.rk-win img{width:100%;height:100%;object-fit:cover;border:0;border-radius:0}
.rk-flame{width:calc(var(--w) * .3);height:calc(var(--w) * .55);margin:-5px auto 0;border-radius:50% 50% 60% 60% / 30% 30% 70% 70%;background:linear-gradient(180deg,#fff7c2,#fbbf24 38%,#f97316 72%,transparent);transform-origin:top center;animation:rkFlame .17s ease-in-out infinite alternate}
.rk-trail{position:absolute;left:50%;bottom:0;width:8px;margin-left:-4px;height:var(--b);border-radius:8px;background:linear-gradient(0deg,transparent,rgba(253,224,71,.0) 5%,rgba(253,224,71,.5));transform-origin:bottom;animation:rkTrail .7s ease-out calc(var(--d) + .5s) both;z-index:1}
.rk-crown{position:absolute;left:50%;top:-1.55rem;margin-left:-1.04rem;font-size:1.6rem;line-height:1;animation:rkPop .6s cubic-bezier(.2,.9,.3,1.3) calc(var(--d) + 1.3s) both}
.rk-card{position:relative;border-radius:1rem;padding:.45rem .3rem .5rem;background:rgba(255,255,255,.94);text-align:center;box-shadow:0 10px 20px -10px rgba(0,0,0,.45);animation:rkPop .55s cubic-bezier(.2,.9,.3,1.2) calc(var(--d) + 1.1s) both}
.rk-tag{display:inline-block;padding:.08rem .5rem;border-radius:999px;font-size:.56rem;font-weight:800;color:#fff;margin-bottom:.2rem}
.rk-stars{font-size:.8rem;letter-spacing:1px;color:#f59e0b;line-height:1}.rk-stars i{font-style:normal;color:#d6d3d1}
/* ===== TOPPERS: extra katarnak animations ===== */
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes rays{to{--ang:360deg}}
@keyframes fadeOn{to{opacity:1}}
.pod-play{position:relative;isolation:isolate}
.pod-play::before{content:"";position:absolute;inset:0;border-radius:1.5rem;z-index:-1;pointer-events:none;background:repeating-conic-gradient(from var(--ang) at 50% 100%,rgba(250,204,21,.34) 0 6deg,transparent 6deg 16deg);-webkit-mask-image:radial-gradient(ellipse at 50% 100%,#000 5%,transparent 78%);mask-image:radial-gradient(ellipse at 50% 100%,#000 5%,transparent 78%);opacity:0;animation:rays 9s linear infinite,fadeOn 1s ease 1.6s forwards}
@keyframes quake{0%,100%{transform:none}15%{transform:translate(-6px,4px)}30%{transform:translate(6px,-4px)}45%{transform:translate(-4px,-3px)}60%{transform:translate(4px,3px)}80%{transform:translate(-2px,1px)}}
.quake{animation:quake .55s ease-in-out}
@keyframes shock{to{transform:translate(-50%,-50%) scale(16);opacity:0;border-width:1px}}
.shock{position:fixed;width:20px;height:20px;border-radius:50%;border:4px solid #facc15;box-shadow:0 0 18px #fde047;pointer-events:none;z-index:250;transform:translate(-50%,-50%);animation:shock .95s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes goldTxt{to{background-position:-200% 0}}
.gold-txt{background:linear-gradient(90deg,#b45309,#f59e0b,#fff7c2,#f59e0b,#b45309);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:podInfo .55s cubic-bezier(.2,.9,.3,1) 1.75s both,goldTxt 2s linear infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(90deg)}}
.pod-1 .pod-gold{position:relative}
.pod-1 .pod-gold::before,.pod-1 .pod-gold::after{content:"\2728";position:absolute;font-size:15px;line-height:1;opacity:0;pointer-events:none;animation:twinkle 1.4s ease-in-out 2.2s infinite}
.pod-1 .pod-gold::before{top:-6px;right:-10px}.pod-1 .pod-gold::after{bottom:-4px;left:-12px;animation-delay:2.9s}
@keyframes rvIn{0%{opacity:0;transform:translateX(var(--rx,-46px)) skewX(8deg) scale(.94)}60%{opacity:1;transform:translateX(5px) skewX(-2deg) scale(1.02)}100%{opacity:1;transform:none}}
.rv:not(.in){opacity:0}
.rv.rl{--rx:-46px}.rv.rr{--rx:46px}
.rv.in{animation:rvIn .65s cubic-bezier(.2,.9,.3,1.25) backwards}
[data-cls]{transition:transform .15s,background-color .15s}[data-cls]:active{transform:scale(.97)}
[data-cls]>div:first-child{position:relative;overflow:hidden}
[data-cls]>div:first-child::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:shineSweep 2.4s ease-in-out infinite}
@keyframes icoPulse{0%,100%{transform:scale(1) rotate(0)}40%{transform:scale(1.14) rotate(-8deg)}70%{transform:scale(1.05) rotate(6deg)}}
.subico{animation:icoPulse 2.4s ease-in-out infinite}
.rv.rr .subico{animation-delay:.6s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}.rv{opacity:1!important;transform:none!important}.shock{display:none}.gold-txt{color:#b45309;-webkit-text-fill-color:#b45309}}

/* ===== Subject cards ===== */

/* ===== Logo photo viewer ===== */
#pv{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;padding:24px;background:rgba(6,40,22,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;transition:opacity .25s ease}

async function saveResult() {
  const p = state.pending; if (!p) return; state.saveErr = ""; if (_goneHit(p.name, p.cls, "", p.createdAt)) return;
  try {
    const id = state.pendingId || push(ref(db, "testResults")).key; state.pendingId = id;
    await set(ref(db, "testResults/" + id), p); state.resultId = id;
    try { tgResult(p, id); } catch (e2) {}
  } catch (e) { state.resultId = null; state.saveErr = (e && (e.code || e.message)) || "error";
    try { tgOnce("rf_" + p.createdAt, () => tgText("⚠️ <b>Result SAVE nahi hua</b>\n👤 " + tgE(p.name) + " · " + tgE(clsLabelEn(p.cls)) + " · " + tgE(p.subject) + "\n✅ " + p.score + "/" + p.total + "\nError: " + tgE(state.saveErr))); } catch (e2) {} }
}
async function submitTest() {
  if (state.submitting) return; state.submitting = true; clearInterval(window._tm);
  try { if (state.liveId) remove(ref(db, "testLive/" + state.liveId)).catch(() => {}); state.liveId = null; } catch (e) {}
  let score = 0;
  state.questions.forEach((q, i) => { const Q = q.Q; if (state.answers[i] === _cv(Q)) score++; });
  state.score = score;
  const timeMs = Math.max(1000, Date.now() - (state.startedAt || Date.now()));
  state.timeMs = timeMs;
  const total = state.questions.length;
  if (total > 0 && score >= total) markMastered(state.name, state.subName, state.cls);
  state.pendingId = null;
  state.pending = { name: state.name.trim().replace(/\s+/g, " "), cls: state.cls, subject: state.subName, subjectKey: state.subKey, medium: state.testLang || lang, score, total, timeMs, leaves: state.leaves || 0, createdAt: Date.now() };
  await saveResult();
  state.screen = "result";
  render();
  if (score / total >= 0.75) confetti();
  try { const cur = fullTopperOf(state.cls); if (score >= total && cur && nk(cur.name) === nk(state.name)) { podBurst(); setTimeout(() => { const h = document.querySelector("#app .th-trophy"); if (h) { const b = h.getBoundingClientRect(); firework(b.left + b.width / 2, b.top + b.height / 2, 36, ["#facc15", "#fbbf24", "#f59e0b", "#ffffff", "#4ade80"]); } }, 700); } } catch (e) {}
}

      ["#guideBtn", "\u{1F4AC}", { en: "Help / Message", hi: "मदद / मैसेज" }, { en: "Koi problem ho ya kuch poochna ho to is chat icon par dabake seedha Amrit ko message karo.", hi: "कोई समस्या हो या कुछ पूछना हो तो इस चैट आइकन को दबाकर सीधे Amrit को मैसेज करो।" }]
    ];
    const ov = document.createElement("div");
    ov.id = "coach"; ov.className = "fixed inset-0 z-[500]";
    ov.innerHTML = '<div class="fixed inset-0"></div><div data-hole class="pointer-events-none fixed rounded-2xl ring-4 ring-white shadow-[0_0_0_9999px_rgba(15,23,42,0.65)] transition-all duration-300"></div><div data-tip class="fixed w-[min(300px,calc(100vw-24px))] rounded-2xl bg-white p-4 shadow-2xl"></div>';
    document.body.appendChild(ov);
    const hole = ov.querySelector("[data-hole]"), tip = ov.querySelector("[data-tip]");
    let i = 0;
    const done = () => { try { localStorage.setItem("amrit_coach_seen", "1"); } catch (e) {} window.removeEventListener("resize", place); ov.remove(); };
    function place() {
      const st = STEPS[i], el = document.querySelector(st[0]); if (!el) return;
      const r = el.getBoundingClientRect(), pad = 5, W = tip.offsetWidth, H = tip.offsetHeight, vw = innerWidth, vh = innerHeight;
      hole.style.cssText = `top:${r.top - pad}px;left:${r.left - pad}px;width:${r.width + pad * 2}px;height:${r.height + pad * 2}px`;
      const above = r.top + r.height / 2 > vh / 2, left = Math.max(12, Math.min(vw - W - 12, r.left + r.width / 2 - W / 2)), ar = Math.max(18, Math.min(W - 18, r.left + r.width / 2 - left));
      tip.style.left = left + "px"; tip.style.top = (above ? Math.max(8, r.top - pad - 14 - H) : r.bottom + pad + 14) + "px";
      const a = tip.querySelector("[data-ar]"); if (a) { a.style.left = (ar - 8) + "px"; a.style.top = above ? "auto" : "-7px"; a.style.bottom = above ? "-7px" : "auto"; }
    }
    function show() {
      const hi = lang === "hi", k = hi ? "hi" : "en", st = STEPS[i], last = i === STEPS.length - 1;
      tip.innerHTML = `<div data-ar class="absolute h-4 w-4 rotate-45 rounded-sm bg-white"></div><div class="relative"><div class="flex items-center gap-2.5"><div class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 text-lg shadow">${st[1]}</div><div class="min-w-0"><div class="text-[10px] font-bold tracking-widest text-indigo-500">${i + 1}/${STEPS.length}</div><div class="text-base font-extrabold leading-tight text-slate-900">${st[2][k]}</div></div></div><p class="mt-2.5 text-sm leading-relaxed text-slate-600">${st[3][k]}</p><div class="mt-3 flex items-center gap-2"><button type="button" data-skip class="rounded-xl bg-slate-100 px-3.5 py-2.5 text-xs font-bold text-slate-500 active:scale-95">${hi ? "छोड़ें" : "Skip"}</button><button type="button" data-next class="flex-1 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 py-2.5 text-sm font-bold text-white shadow-lg shadow-indigo-500/25 active:scale-95">${last ? (hi ? "समझ गया ✔" : "Samajh gaya ✔") : (hi ? "आगे →" : "Aage →")}</button></div></div>`;
      tip.querySelector("[data-skip]").onclick = done;
      tip.querySelector("[data-next]").onclick = () => { if (last) done(); else { i++; show(); } };
      place(); setTimeout(place, 60);
    }
    window.addEventListener("resize", place);
    show();
  } catch (e) {}
}, 1200);
// ===== HELP BUBBLE: site khulte hi chat icon ke neeche batata hai "koi problem ho to yahan message karo" =====
setTimeout(() => {
  try {
    try { if (localStorage.getItem("amrit_hptip_seen")) return; } catch (e) {} // sirf pehli baar
    if (document.getElementById("coach")) return; const b = document.getElementById("guideBtn"); if (!b || state.screen === "quiz" || state.screen === "help" || document.getElementById("hpTip")) return;
    try { localStorage.setItem("amrit_hptip_seen", "1"); } catch (e) {}
    const hi = lang === "hi", r = b.getBoundingClientRect(), W = Math.min(270, innerWidth - 24);
    const left = Math.max(12, Math.min(innerWidth - W - 12, r.left + r.width / 2 - W / 2)), arrow = Math.max(16, Math.min(W - 16, r.left + r.width / 2 - left));
    const t = document.createElement("div"); t.id = "hpTip"; t.setAttribute("role", "status");
    t.style.cssText = `left:${left}px;top:${r.bottom + 12}px;width:${W}px;--ar:${arrow}px`;
    t.innerHTML = `<button type="button" class="hpt-x" aria-label="Close">&times;</button><div class="hpt-t">\u{1F4AC} ${hi ? "कोई समस्या है? सीधे मैसेज करें" : "Koi problem hai? Seedha message karein"}</div><div class="hpt-p">${hi ? "टेस्ट, रिज़ल्ट, गेम या कुछ भी — इस चैट आइकन पर टैप करके Amrit को लिखें। जवाब यहीं मिलेगा।" : "Test, result, game ya kuch bhi — is chat icon par tap karke Amrit ko likhein. Jawab yahin milega."}</div>`;
    document.body.appendChild(t); b.classList.add("hpt-ring");
    const done = () => { t.classList.add("out"); b.classList.remove("hpt-ring"); setTimeout(() => t.remove(), 300); };
    t.onclick = e => { const x = e.target.closest(".hpt-x"); done(); if (!x && state.screen !== "quiz") { state.screen = "help"; render(); window.scrollTo({ top: 0, left: 0, behavior: "instant" }); } };
    setTimeout(done, 12000);
  } catch (e) {}
}, 1800);
// Purani chhoti (96px) photo ko is phone ki HD copy se saaf 240px mein badal do (ek baar, apne aap)
setTimeout(async () => {
  try {
    if (!state.saved || !okPhoto(saved.photo) || saved.photo.length > 14000) return;
    const hd = hdGet(state.name, state.cls); if (!hd) return;
    const np = await resizePhoto(hd); if (!okPhoto(np) || np.length <= saved.photo.length) return;
    saved.photo = np; photoMap.set(nk(state.name), np); saveProfile();
    if (saved.sid && !_goneHit(state.name, state.cls, saved.sid, saved.createdAt)) await set(ref(db, "testStudents/" + saved.sid), stuRec(state.name, state.cls));
    if (state.screen !== "quiz") render();
  } catch (e) {}
}, 3500);
setTimeout(async () => {
  try {
    if (!state.saved || !saved.sid || !saved.uid || _goneHit(state.name, state.cls, saved.sid, saved.createdAt)) return;
    const rec = stuNames.get(nk(state.name));
    if (rec && (rec.sid !== saved.sid || rec.uid === saved.uid)) return;
    await set(ref(db, "testStudents/" + saved.sid), stuRec(state.name, state.cls));
    if ((await claimName(nk(state.name), saved.sid, saved.uid)) !== "taken") { saved.nk = nk(state.name); saveProfile(); }
  } catch (e) {}
}, 4500);
render();


</script>
<script>
(function(){
  var im=document.getElementById("logoImg");if(!im)return;
  var v=document.createElement("div");v.id="pv";v.setAttribute("role","dialog");v.setAttribute("aria-label","Photo");
  v.innerHTML='<button class="x" aria-label="Close">&times;</button><img class="ph" alt="Amrit Tiwari"><div class="cap"><b>Amrit Tiwari</b></div>';
  document.body.appendChild(v);
  var big=v.querySelector(".ph"),t;
  function open(){if(!im.complete||!im.naturalWidth)return;big.src=im.src;clearTimeout(t);v.classList.add("on");void v.offsetWidth;v.classList.add("show");document.documentElement.style.overflow="hidden"}
  function close(){v.classList.remove("show");clearTimeout(t);t=setTimeout(function(){v.classList.remove("on");document.documentElement.style.overflow=""},280)}
  im.addEventListener("click",open);
  im.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}});
  v.addEventListener("click",close);
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&v.classList.contains("on"))close()});
})();
</script>
